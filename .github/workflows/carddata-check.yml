name: Carddata check

on:
  pull_request:
    paths:
      - 'packages/carddata/**'
      - 'packages/scenarios/**'
      - '.github/workflows/carddata-check.yml'

permissions:
  contents: read

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm carddata:fetch --lang en,de
      # Skipped in CI's unit tests, which have no fetched cards: holds the hand-entered
      # scenario cards to ArkhamDB's data.
      - run: pnpm vitest run packages/scenarios/src/arkhamdb_check.test.ts
        env:
          ARKHAMDB_CHECK: required
      - name: Summarise fetched data
        run: |
          {
            echo '### Fetched card data'
            echo '| file | cards | with encounter code |'
            echo '| --- | --- | --- |'
            for f in packages/carddata/.cache/*/*.json; do
              total=$(jq 'length' "$f")
              enc=$(jq '[.[] | select(.encounterCode)] | length' "$f")
              echo "| ${f#packages/carddata/.cache/} | $total | $enc |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
