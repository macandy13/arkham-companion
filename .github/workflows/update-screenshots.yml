name: Update screenshots

# Photographs every flow and screenshot spec on a branch and commits the goldens that changed
# (apps/web/e2e/__screenshots__), as the repo's GitHub App bot. Goldens are made only here, on
# the runner image CI's E2E job compares them on: another machine renders text a few pixels
# differently, so a golden from a laptop would fail in CI. A session dispatches it after pushing
# a change that alters what a screen shows, or labels the PR `update-screenshots` (the label
# also works before this workflow is on main, which a dispatch needs), then merges the bot's
# commit before its next push (docs/automation.md). The App token, not GITHUB_TOKEN, pushes the commit, because a push with
# GITHUB_TOKEN starts no workflows and the PR's checks would not run again.

on:
  workflow_dispatch:
    inputs:
      branch:
        description: Branch to photograph and commit the changed goldens to
        required: true
  pull_request:
    types: [labeled]

permissions: {}

concurrency:
  group: update-screenshots-${{ inputs.branch || github.head_ref }}
  cancel-in-progress: true

env:
  BRANCH: ${{ inputs.branch || github.head_ref }}

jobs:
  update:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-screenshots'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ vars.CLAUDE_BOT_APP_ID || secrets.CLAUDE_BOT_APP_ID }}
          private-key: ${{ secrets.CLAUDE_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ steps.app.outputs.token }}
      - uses: ./.github/actions/e2e_setup
      # A spec that fails for another reason keeps its old golden; CI's E2E job reports it.
      - name: Photograph
        working-directory: apps/web
        env:
          GOLDENS: '1'
        run: >-
          pnpm exec playwright test --project=flow-picture --project=screenshot
          --project=screenshot-phone --workers=100% --update-snapshots=changed ||
          echo "::warning::Some specs failed; their goldens stay as they were."
      - name: Commit the changed goldens
        run: |
          git add apps/web/e2e/__screenshots__
          if git diff --cached --quiet; then
            echo "No golden changed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git -c user.name='arkham-claude[bot]' \
            -c user.email='arkham-claude[bot]@users.noreply.github.com' \
            commit -m 'test(web): update screenshot goldens'
          git push origin "HEAD:$BRANCH"
          git show --stat --format= HEAD >> "$GITHUB_STEP_SUMMARY"
      # So the next change that needs new goldens can label the PR again.
      - if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label update-screenshots
