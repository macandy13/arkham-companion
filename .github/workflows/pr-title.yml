name: PR title

# PRs are squash-merged with the PR title as the commit message, so the title must be a
# Conventional Commit (feat:, fix:, docs:, …). Release Please builds the changelog from it.
# pull_request_target is safe here: the job never checks out or runs PR code.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            build
            ci
            chore
            revert
          requireScope: false
