name: Main pictures

# Photographs every E2E spec on main as it ends (`e2e:pictures`) and caches the report and
# pictures (see .github/actions/main_pictures), so a PR preview built on this commit takes its
# base pictures from the cache instead of photographing the base itself (preview.yml). Checked out
# under base/, where the preview job unpacks base pictures, since the report names them by
# absolute path. Caches saved on main are readable from every PR (a dispatch from another branch
# saves where PRs can't read it). An entry is never photographed again: a spec that failed by
# chance stays failed on the base, and so shown, until main's trees change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only the newest commit matters: PRs are built on main's tip.
concurrency:
  group: main-pictures
  cancel-in-progress: true

jobs:
  pictures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: base
      - id: cache
        uses: ./base/.github/actions/main_pictures
      - id: cached
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}
          lookup-only: true
      - if: steps.cached.outputs.cache-hit != 'true'
        uses: ./base/.github/actions/e2e_setup
        with:
          dir: base
          cache-name: main
      # A failing spec is cached too: the preview shows it as not photographed on the base.
      - if: steps.cached.outputs.cache-hit != 'true'
        working-directory: base
        timeout-minutes: 30
        continue-on-error: true
        run: |
          pnpm --filter @arkham/web e2e:pictures --workers=100% || echo "::warning::Some specs failed; they are cached as not photographed."
          mkdir -p apps/web/screencasts/pictures
          mv apps/web/screencasts/report.json apps/web/screencasts/pictures/main.json
      # Without a report the run broke off; nothing is cached, so PRs photograph their base.
      - if: steps.cached.outputs.cache-hit != 'true' && hashFiles('base/apps/web/screencasts/pictures/main.json') != ''
        uses: actions/cache/save@v6
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}
