name: Main pictures

# Photographs every E2E spec on main as it ends (`e2e:pictures`) and caches the report and
# pictures (see .github/actions/main_pictures), so a PR preview built on this commit takes its
# base pictures from the cache instead of photographing the base itself (preview.yml). Checked out
# under base/, where the preview job unpacks base pictures, since the report names them by
# absolute path. Caches saved on main are readable from every PR (a dispatch from another branch
# saves where PRs can't read it). An entry is never photographed again: a spec that failed by
# chance stays failed on the base, and so shown, until main's trees change.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  # The save job downloads the shards' artifacts with `gh run download`.
  actions: read

# No concurrency limit: main often takes a merge a minute, and a run that a newer one cancelled
# leaves its commit without pictures, so every PR built on it photographed its base itself.

# Split into three shards like the preview's picture jobs, so a PR pushed right after a merge waits
# about as long for its base as for its own pictures (preview.yml `base-cache`); the save job then
# caches the shards' reports and pictures as one entry.
jobs:
  lookup:
    runs-on: ubuntu-latest
    outputs:
      key: ${{ steps.cache.outputs.key }}
      path: ${{ steps.cache.outputs.path }}
      cached: ${{ steps.cached.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v7
        with:
          path: base
      - id: cache
        uses: ./base/.github/actions/main_pictures
      - id: cached
        uses: actions/cache/restore@v6
        with:
          key: ${{ steps.cache.outputs.key }}
          path: ${{ steps.cache.outputs.path }}
          lookup-only: true

  pictures:
    needs: lookup
    if: needs.lookup.outputs.cached != 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          path: base
      - uses: ./base/.github/actions/e2e_setup
        with:
          dir: base
      # A failing spec is cached too: the preview shows it as not photographed on the base.
      - working-directory: base
        timeout-minutes: 20
        continue-on-error: true
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          pnpm --filter @arkham/web e2e:pictures --workers=100% --shard="$SHARD/3" || echo "::warning::Some specs failed; they are cached as not photographed."
          mkdir -p apps/web/screencasts/pictures
          mv apps/web/screencasts/report.json "apps/web/screencasts/pictures/$SHARD.json"
      - uses: actions/upload-artifact@v7
        with:
          name: main-pictures-${{ matrix.shard }}
          # package.json always exists, so the artifact's root stays base/apps/web.
          path: |
            base/apps/web/package.json
            base/apps/web/screencasts/pictures/
            base/apps/web/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 1

  save:
    needs: [lookup, pictures]
    if: ${{ !cancelled() && needs.lookup.outputs.cached != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          mkdir -p base/apps/web
          gh run download "$GITHUB_RUN_ID" -R "$GITHUB_REPOSITORY" -p 'main-pictures-*' -D "$RUNNER_TEMP/shards" ||
            echo "::warning::No shard artifacts."
          for shard in "$RUNNER_TEMP"/shards/*/; do cp -r "$shard." base/apps/web; done
      # Only a whole run is cached: without a shard's report its specs would all show on every PR.
      - id: whole
        run: |
          reports=(base/apps/web/screencasts/pictures/*.json)
          [ -e "${reports[0]}" ] && [ "${#reports[@]}" -eq 3 ] && echo "whole=true" >> "$GITHUB_OUTPUT" ||
            echo "::warning::Not every shard reported; nothing is cached, so PRs photograph their base."
      - if: steps.whole.outputs.whole == 'true'
        uses: actions/cache/save@v6
        with:
          key: ${{ needs.lookup.outputs.key }}
          path: ${{ needs.lookup.outputs.path }}
