name: Release

# Release Please reads the Conventional Commit titles merged into main, keeps
# CHANGELOG.md up to date and maintains a "chore(main): release x.y.z" PR.
# Merging that PR creates the git tag and the GitHub release.
# Repo setting needed: Actions → General → "Allow GitHub Actions to create and approve pull requests".
#
# A push waits an hour before Release Please runs, and every newer push cancels
# the waiting run, so the release PR is opened or refreshed only once main has
# been quiet for an hour instead of after each merge in a burst. Running the
# workflow by hand skips the wait.
#
# The wait is a job of its own: while Release Please slept in its own job, the
# job's GITHUB_TOKEN, an hour old by then, could still read the repo but was
# refused creating the release ("Resource not accessible by integration").
# Its job now starts after the wait, with a fresh token.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: true

jobs:
  wait:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions: {}
    steps:
      - name: Wait for an hour without a new push
        run: sleep 3600

  release-please:
    needs: wait
    # Runs after the wait, or straight away when the wait job was skipped
    # because the workflow was started by hand.
    if: ${{ !cancelled() && needs.wait.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
