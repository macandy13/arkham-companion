name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # The committed API reports must match the exports, so an API change is visible in the diff.
      - name: API reports are up to date
        run: |
          pnpm api:report
          git diff --exit-code -- 'packages/*/api.md' || {
            echo '::error::packages/*/api.md is out of date. Run pnpm api:report and commit the result.'
            exit 1
          }
      # Fails when coverage drops below the floors in vitest.config.ts.
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          f=coverage/coverage-summary.json
          [ -f "$f" ] || exit 0
          {
            echo '### Coverage'
            echo '| | % |'
            echo '| --- | --- |'
            for k in lines statements functions branches; do
              echo "| $k | $(jq ".total.$k.pct" "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @arkham/web exec playwright install --with-deps chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
