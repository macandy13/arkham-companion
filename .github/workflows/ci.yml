name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      # Fails when coverage drops below the floors in vitest.config.ts.
      - run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: |
          f=coverage/coverage-summary.json
          [ -f "$f" ] || exit 0
          {
            echo '### Coverage'
            echo '| | % |'
            echo '| --- | --- |'
            for k in lines statements functions branches; do
              echo "| $k | $(jq ".total.$k.pct" "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The card pictures the E2E shots show, downloaded once by Playwright's global setup
      # (apps/web/e2e/fixtures/card_pictures.ts) and kept here, never in the repo.
      - uses: actions/cache@v6
        with:
          path: apps/web/e2e/.card_pictures
          key: card-pictures-${{ hashFiles('packages/scenarios/src/the_gathering/cards.ts', 'packages/scenarios/src/card_builders.ts', 'apps/web/e2e/fixtures/card_pictures.ts') }}
          restore-keys: card-pictures-
      # Chromium's headless shell without apt, as in preview.yml (see there). This job also runs
      # on main, so its cache is the one every PR's preview and E2E job restore.
      - id: playwright
        run: echo "version=$(pnpm --filter @arkham/web exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - timeout-minutes: 5
        run: pnpm --filter @arkham/web exec playwright install --only-shell chromium
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
