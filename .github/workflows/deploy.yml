name: Deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Bump to force a fresh card data download (e.g. after upstream corrections).
      CARDDATA_EPOCH: 2026-10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        id: carddata
        with:
          path: packages/carddata/.cache
          key: carddata-${{ hashFiles('packages/carddata/src/schema.ts', 'packages/carddata/src/fetch.ts') }}-${{ env.CARDDATA_EPOCH }}
      - if: steps.carddata.outputs.cache-hit != 'true'
        run: pnpm carddata:fetch --lang en,de
      - run: pnpm --filter @arkham/web build
        env:
          VITE_BASE: /arkham-companion/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
