name: Deploy

# Publishes main to the root of the gh-pages branch. PR previews live under
# gh-pages/pr-preview/ (see preview.yml) and are left untouched here.
# Repo setting: Pages → Source: "Deploy from a branch" → gh-pages / (root).

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Bump to force a fresh card data download (e.g. after upstream corrections).
      CARDDATA_EPOCH: 2026-10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v6
        id: carddata
        with:
          path: packages/carddata/.cache
          key: carddata-${{ hashFiles('packages/carddata/src/schema.ts', 'packages/carddata/src/fetch.ts') }}-${{ env.CARDDATA_EPOCH }}
      - if: steps.carddata.outputs.cache-hit != 'true'
        run: pnpm carddata:fetch --lang en,de
      - run: pnpm build
        env:
          VITE_BASE: /arkham-companion/
      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: apps/web/dist
          clean-exclude: pr-preview/
          force: false
