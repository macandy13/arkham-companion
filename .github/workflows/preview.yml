name: PR preview

# Builds every PR and publishes it to
# https://macandy13.github.io/arkham-companion/pr-preview/pr-<number>/
# The action comments the link on the PR and removes the preview when the PR closes.
# When apps/web changes, every E2E spec is photographed as it ends, on this PR and on its base
# commit; the screenshot specs whose picture this PR changes and recordings of the flows whose
# end state it changes are published next to the preview (pr-<number>/screencasts/), and the PR
# description's screencast section is rewritten to show them (see docs/automation.md). The base
# and the PR are photographed in parallel jobs, the slow part; the preview job then films the
# changed flows and publishes everything.
# Living inside the preview directory means they are removed with it.
# PRs from forks are skipped (no write token).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write
  # The preview job downloads the picture jobs' artifacts with `gh run download`.
  actions: read

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  changes:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.action != 'closed'
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              # So a change to this workflow runs (and times) the jobs it changes.
              - '.github/workflows/preview.yml'
              - '.github/actions/e2e_setup/**'

  # Photographs the base commit's specs, so only the specs whose picture (a shot, or a flow's end
  # state) this PR changes are shown. A checkout of its own with its own install and its own
  # `e2e:pictures` script, so the base builds with its own packages and photographs with its own
  # projects (naming a project the base doesn't have would fail its run). Its report names its
  # pictures under `base/`, where the preview job unpacks them. Specs it doesn't photograph are all shown.
  pictures-base:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The merge commit's first parent, the base the PR's merge commit (photographed by
      # pictures-head) was built on; the event's base sha can lag behind it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
          path: base
      - run: git -C base checkout --detach HEAD^1
      - uses: ./.github/actions/e2e_setup
        with:
          dir: base
          cache-name: base
      # Every core: the runs are CPU-bound, and Playwright's default leaves half of them idle.
      - working-directory: base
        timeout-minutes: 20
        continue-on-error: true
        run: pnpm --filter @arkham/web e2e:pictures --workers=100%
      - uses: actions/upload-artifact@v7
        with:
          name: pictures-base
          # package.json always exists, so the artifact's root stays base/apps/web.
          path: |
            base/apps/web/package.json
            base/apps/web/screencasts/report.json
            base/apps/web/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 1

  pictures-head:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/e2e_setup
        with:
          cache-name: head
      # A failing spec must not block the preview; the E2E check reports it.
      - timeout-minutes: 20
        continue-on-error: true
        run: pnpm --filter @arkham/web e2e:pictures --workers=100%
      - uses: actions/upload-artifact@v7
        with:
          name: pictures-head
          # package.json always exists, so the artifact's root stays apps/web.
          path: |
            apps/web/package.json
            apps/web/screencasts/report.json
            apps/web/test-results/**/*.png
          if-no-files-found: ignore
          retention-days: 1

  preview:
    needs: [changes, pictures-base, pictures-head]
    # Also when the picture jobs are skipped (no apps/web change) or the PR closed, to update or remove the preview.
    if: ${{ !cancelled() && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      WEB: ${{ needs.changes.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - if: github.event.action != 'closed'
        uses: ./.github/actions/e2e_setup
        with:
          cache-name: preview
      # Unpacked where each job ran, since their reports name their pictures by absolute path. A
      # picture job that failed leaves no artifact: without the base every spec is shown, without
      # the PR's pictures the section is left as it is.
      - if: env.WEB == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" -n pictures-base -D base/apps/web ||
            echo "::warning::No pictures of the base commit; every spec is shown."
          gh run download "$GITHUB_RUN_ID" -n pictures-head -D apps/web ||
            echo "::warning::No pictures of this PR; the description keeps its section."
      # Only the flows whose end state differs from the base are filmed, slowed down, since
      # recording them is slow (cli.ts flows caps them at SCREENCAST_LIMIT). Recorded before the
      # preview build: Playwright builds with the root base path, and the preview build below
      # empties dist/ anyway.
      - id: flows
        if: env.WEB == 'true' && hashFiles('apps/web/screencasts/report.json') != ''
        working-directory: apps/web
        continue-on-error: true
        run: |
          grep=$(node scripts/screencast/cli.ts flows screencasts/report.json ../../base/apps/web/screencasts/report.json)
          printf 'grep<<END_OF_GREP\n%s\nEND_OF_GREP\n' "$grep" >> "$GITHUB_OUTPUT"
      - if: env.WEB == 'true' && steps.flows.outputs.grep != ''
        continue-on-error: true
        run: pnpm --filter @arkham/web e2e:screencast --grep "$FLOWS"
        env:
          FLOWS: ${{ steps.flows.outputs.grep }}
      # ffmpeg only turns flow videos into GIFs, and it comes from Ubuntu's mirror (see .github/actions/e2e_setup), so
      # it is installed only when a flow was recorded, and a slow mirror times the step out instead
      # of stalling the run. Without ffmpeg the render step fails and the description keeps its
      # old section, but the preview is still deployed.
      - if: env.WEB == 'true' && hashFiles('apps/web/test-results/screencast/**/*.webm') != ''
        timeout-minutes: 5
        continue-on-error: true
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - if: env.WEB == 'true' && hashFiles('apps/web/screencasts/report.json') != ''
        working-directory: apps/web
        continue-on-error: true
        run: >-
          node scripts/screencast/cli.ts render screencasts/report.json ../../base/apps/web/screencasts/report.json screencasts/recording.json screencasts/out
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/screencasts/"
          "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/pr-preview/pr-${{ github.event.number }}/screencasts/"
          "${HEAD_SHA::7}"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: github.event.action != 'closed'
        run: pnpm build
        env:
          VITE_BASE: /arkham-companion/pr-preview/pr-${{ github.event.number }}/
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        run: cp -r apps/web/screencasts/out apps/web/dist/screencasts
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
      # The description's pictures come from the gh-pages branch itself (raw.githubusercontent.com),
      # which serves the push above at once, so it is updated without waiting for the Pages build;
      # only the player link starts working once Pages has deployed (a minute or two). The raw host
      # caches a branch URL for 5 minutes whatever its query string, so the links name the commit
      # just pushed (a later one from another PR's preview holds these files too).
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          PAGES_COMMIT=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          [ -n "$PAGES_COMMIT" ] || { echo "::error::No gh-pages branch to link the pictures from."; exit 1; }
          sed -i "s#/gh-pages/pr-preview/#/$PAGES_COMMIT/pr-preview/#g" apps/web/screencasts/out/section.md
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node apps/web/scripts/screencast/cli.ts splice "$RUNNER_TEMP/body.md" apps/web/screencasts/out/section.md > "$RUNNER_TEMP/new-body.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F "body=@$RUNNER_TEMP/new-body.md" --silent
