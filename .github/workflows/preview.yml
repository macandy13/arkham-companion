name: PR preview

# Builds every PR and publishes it to
# https://macandy13.github.io/arkham-companion/pr-preview/pr-<number>/
# The action comments the link on the PR and removes the preview when the PR closes.
# PRs from forks are skipped (no write token).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - if: github.event.action != 'closed'
        run: pnpm build
        env:
          VITE_BASE: /arkham-companion/pr-preview/pr-${{ github.event.number }}/
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
