name: PR preview

# Builds every PR and publishes it to
# https://macandy13.github.io/arkham-companion/pr-preview/pr-<number>/
# The action comments the link on the PR and removes the preview when the PR closes.
# When apps/web changes, the `@flow` E2E specs are recorded and the `@shot` specs
# photographed, both published next to the preview (pr-<number>/screencasts/), and the PR
# description's screencast section is rewritten to show them (see docs/automation.md). Only
# the specs whose picture this PR changes are shown, compared with a run on the base commit.
# Living inside the preview directory means they are removed with it.
# PRs from forks are skipped (no write token).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit plus its first parent, the base commit its pictures are compared with.
          fetch-depth: 2
      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v6
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - id: changes
        if: github.event.action != 'closed'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
              # So a change to this workflow runs (and times) the steps it changes.
              - '.github/workflows/preview.yml'
      # The card pictures the E2E shots show, downloaded once by Playwright's global setup
      # (apps/web/e2e/fixtures/card_pictures.ts) and kept here, never in the repo.
      - if: steps.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: apps/web/e2e/.card_pictures
          key: card-pictures-${{ hashFiles('packages/scenarios/src/the_gathering/cards.ts', 'packages/scenarios/src/card_builders.ts', 'apps/web/e2e/fixtures/card_pictures.ts') }}
          restore-keys: card-pictures-
      # Headless runs only need Chromium's headless shell, cached per Playwright version. No
      # `--with-deps`: the runner image already has the libraries it needs, and apt only added
      # fonts the app doesn't use (it bundles its own) from Ubuntu's mirror, which can drop to
      # 55 kB/s when many jobs start at once and stall a run for 10 minutes.
      - id: playwright
        if: steps.changes.outputs.web == 'true'
        run: echo "version=$(pnpm --filter @arkham/web exec playwright --version | awk '{ print $2 }')" >> "$GITHUB_OUTPUT"
      - if: steps.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ env.ImageOS }}-${{ steps.playwright.outputs.version }}
      - if: steps.changes.outputs.web == 'true'
        timeout-minutes: 5
        run: pnpm --filter @arkham/web exec playwright install --only-shell chromium
      # Records the base commit's tagged specs too, so the render step can leave out every spec
      # whose picture (a shot, or a flow's end state) this PR doesn't change, including specs an
      # earlier PR left tagged on main. Its own install, so the base builds with its own packages.
      # If the base run fails, every tagged spec is shown.
      - if: steps.changes.outputs.web == 'true'
        timeout-minutes: 15
        continue-on-error: true
        run: |
          mkdir -p apps/web/screencasts
          echo '{}' > apps/web/screencasts/base.json
          if ! (git worktree add --detach "$RUNNER_TEMP/base" HEAD^1 &&
              { cp -r apps/web/e2e/.card_pictures "$RUNNER_TEMP/base/apps/web/e2e/" ||
                echo "::notice::No cached card pictures; the base run downloads them."; } &&
              cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile --prefer-offline &&
              cd apps/web && PLAYWRIGHT_JSON_OUTPUT_FILE="$GITHUB_WORKSPACE/apps/web/screencasts/base.json" \
                pnpm exec playwright test --project=screencast --project=screenshot --reporter=json --pass-with-no-tests); then
            echo "::warning::The base commit's run failed; specs it didn't photograph are all shown."
          fi
      # Recorded before the preview build: Playwright builds with the root base path,
      # and the preview build below empties dist/ anyway.
      - if: steps.changes.outputs.web == 'true'
        # A failing flow must not block the preview; the E2E check reports it.
        continue-on-error: true
        run: pnpm --filter @arkham/web e2e:screencast
      # ffmpeg only turns flow videos into GIFs, and it comes from Ubuntu's mirror (see above), so
      # it is installed only when a flow was recorded, and a slow mirror fails the step instead of
      # stalling the run.
      - if: steps.changes.outputs.web == 'true' && hashFiles('apps/web/test-results/screencast/**/*.webm') != ''
        timeout-minutes: 5
        run: |
          command -v ffmpeg || { sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg; }
      - if: steps.changes.outputs.web == 'true' && hashFiles('apps/web/screencasts/report.json') != ''
        working-directory: apps/web
        run: >-
          node scripts/screencast/cli.ts render screencasts/report.json screencasts/base.json screencasts/out
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/screencasts/"
          "https://raw.githubusercontent.com/${{ github.repository }}/gh-pages/pr-preview/pr-${{ github.event.number }}/screencasts/"
          "${HEAD_SHA::7}"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: github.event.action != 'closed'
        run: pnpm build
        env:
          VITE_BASE: /arkham-companion/pr-preview/pr-${{ github.event.number }}/
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        run: cp -r apps/web/screencasts/out apps/web/dist/screencasts
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
      # The description's pictures come from the gh-pages branch itself (raw.githubusercontent.com),
      # which serves the push above at once, so it is updated without waiting for the Pages build;
      # only the player link starts working once Pages has deployed (a minute or two). The raw host
      # caches a branch URL for 5 minutes whatever its query string, so the links name the commit
      # just pushed (a later one from another PR's preview holds these files too).
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          PAGES_COMMIT=$(git ls-remote origin refs/heads/gh-pages | cut -f1)
          [ -n "$PAGES_COMMIT" ] || { echo "::error::No gh-pages branch to link the pictures from."; exit 1; }
          sed -i "s#/gh-pages/pr-preview/#/$PAGES_COMMIT/pr-preview/#g" apps/web/screencasts/out/section.md
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node apps/web/scripts/screencast/cli.ts splice "$RUNNER_TEMP/body.md" apps/web/screencasts/out/section.md > "$RUNNER_TEMP/new-body.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F "body=@$RUNNER_TEMP/new-body.md" --silent
