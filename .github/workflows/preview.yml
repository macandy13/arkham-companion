name: PR preview

# Builds every PR and publishes it to
# https://macandy13.github.io/arkham-companion/pr-preview/pr-<number>/
# The action comments the link on the PR and removes the preview when the PR closes.
# When apps/web changes, the `@flow` E2E specs are recorded and the `@shot` specs
# photographed, both published next to the preview (pr-<number>/screencasts/), and the PR
# description's screencast section is rewritten to show them (see docs/automation.md). Only
# the specs whose tag this PR adds are shown; tags already on the base branch belong to earlier
# PRs. Living inside the preview directory means they are removed with it.
# PRs from forks are skipped (no write token).

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The PR's merge commit plus its first parent, the base commit whose tags are skipped.
          fetch-depth: 2
      - if: github.event.action != 'closed'
        uses: pnpm/action-setup@v6
      - if: github.event.action != 'closed'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - id: changes
        if: github.event.action != 'closed'
        uses: dorny/paths-filter@v4
        with:
          filters: |
            web:
              - 'apps/web/**'
      # Lists the specs the base commit already tags, so the render step skips them. If the listing
      # fails (e.g. a base spec that no longer loads), every tagged spec is shown.
      - if: steps.changes.outputs.web == 'true'
        run: |
          mkdir -p apps/web/screencasts
          git worktree add --detach "$RUNNER_TEMP/base" HEAD^1
          ln -s "$PWD/node_modules" "$RUNNER_TEMP/base/node_modules"
          ln -s "$PWD/apps/web/node_modules" "$RUNNER_TEMP/base/apps/web/node_modules"
          if ! (cd "$RUNNER_TEMP/base/apps/web" && PLAYWRIGHT_JSON_OUTPUT_FILE="$RUNNER_TEMP/base.json" \
              pnpm exec playwright test --list --reporter=json --project=screencast --project=screenshot --pass-with-no-tests); then
            echo "::warning::Could not list the base commit's tagged specs; showing every tagged spec."
            echo '{}' > "$RUNNER_TEMP/base.json"
          fi
          cp "$RUNNER_TEMP/base.json" apps/web/screencasts/base.json
      # The card pictures the E2E shots show, downloaded once by Playwright's global setup
      # (apps/web/e2e/fixtures/card_pictures.ts) and kept here, never in the repo.
      - if: steps.changes.outputs.web == 'true'
        uses: actions/cache@v6
        with:
          path: apps/web/e2e/.card_pictures
          key: card-pictures-${{ hashFiles('packages/scenarios/src/the_gathering/cards.ts', 'apps/web/e2e/fixtures/card_pictures.ts') }}
          restore-keys: card-pictures-
      # Recorded before the preview build: Playwright builds with the root base path,
      # and the preview build below empties dist/ anyway.
      - if: steps.changes.outputs.web == 'true'
        # A failing flow must not block the preview; the E2E check reports it.
        continue-on-error: true
        run: |
          pnpm --filter @arkham/web exec playwright install --with-deps chromium
          command -v ffmpeg || sudo apt-get install -y --no-install-recommends ffmpeg
          pnpm --filter @arkham/web e2e:screencast
      - if: steps.changes.outputs.web == 'true' && hashFiles('apps/web/screencasts/report.json') != ''
        working-directory: apps/web
        run: >-
          node scripts/screencast/cli.ts render screencasts/report.json screencasts/base.json screencasts/out
          "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/screencasts/"
          "${HEAD_SHA::7}"
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      - if: github.event.action != 'closed'
        run: pnpm build
        env:
          VITE_BASE: /arkham-companion/pr-preview/pr-${{ github.event.number }}/
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        run: cp -r apps/web/screencasts/out apps/web/dist/screencasts
      - uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: apps/web/dist
          preview-branch: gh-pages
          umbrella-dir: pr-preview
      # The push above only starts a GitHub Pages build; the files are served once it finishes.
      # A newer push to gh-pages (another PR's preview) can cancel this build, but its own build
      # then publishes these files too, so wait for this push's version.txt, not for a build.
      # The query string defeats the Pages CDN cache. On timeout the description is updated
      # anyway: its links start working with the next Pages build.
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        timeout-minutes: 15
        continue-on-error: true
        env:
          URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/screencasts/version.txt
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          until [ "$(curl -fsS --max-time 10 "$URL?t=$(date +%s)" 2>/dev/null)" = "${HEAD_SHA::7}" ]; do sleep 15; done
      - if: hashFiles('apps/web/screencasts/out/section.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.number }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq '.body // ""' > "$RUNNER_TEMP/body.md"
          node apps/web/scripts/screencast/cli.ts splice "$RUNNER_TEMP/body.md" apps/web/screencasts/out/section.md > "$RUNNER_TEMP/new-body.md"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR" -F "body=@$RUNNER_TEMP/new-body.md" --silent
