version: 2
updates:
  # npm dependencies of the whole pnpm workspace, grouped into at most two weekly PRs.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
      major:
        update-types: [major]
    ignore:
      # typescript-eslint refuses TypeScript 7 (typescript-eslint#10940); lift once it supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
    ignore:
      # Its v3 is an unreleased dev branch whose inputs differ (build-script fails).
      # `versions: ['3.x']` didn't match the `v3` branch ref (#532), so ignore majors instead.
      - dependency-name: preactjs/compressed-size-action
        update-types: ['version-update:semver-major']
    groups:
      actions:
        patterns: ['*']
