        return applyResolution(log, 'devourer', 'R1').log;
      }

      // ---------- UI state ----------
      const ui = {
        demo: 'afterGathering',
        log: demoLog('afterGathering'),
        fresh: new Set(),
        view: 'log', // 'log' | 'playing' | 'new'
        dialog: null, // { kind, ... }
        undo: null,
        skin: 'printed',
        theme: 'auto',
        newCampaign: { difficulty: 'standard', team: ['roland', 'daisy', 'wendy'] },
      };

      const $ = (id) => document.getElementById(id);
      const nextScenario = () => SCENARIOS[ui.log.position];
      const blocked = () => ui.log.investigators.filter((m) => m.fate !== 'alive');

      function render() {
        document.documentElement.dataset.skin = ui.skin;
        if (ui.theme === 'auto') delete document.documentElement.dataset.theme;
        else document.documentElement.dataset.theme = ui.theme;
        renderBar();
        $('main').innerHTML =
          ui.view === 'new'
            ? renderNewCampaign()
            : ui.view === 'playing'
              ? renderPlaying()
              : renderDesk();
        renderNext();
        renderDialog();
        renderMenu();
      }

      function renderBar() {
        const next = nextScenario();
        const diff = ui.log.difficulty[0].toUpperCase() + ui.log.difficulty.slice(1);
        $('bar-title').textContent = ui.view === 'new' ? 'New campaign' : 'Night of the Zealot';
        $('bar-sub').textContent =
          ui.view === 'new'
            ? 'Campaign, difficulty and investigators'
            : `${diff} · ${ui.log.result ? 'Campaign over' : next ? `Chapter ${next.num} next` : ''}`;
        $('bag-btn').innerHTML =
          `${token('elder_sign', 26)}<span>${ui.log.bag.length} tokens</span>`;
        $('bag-btn').hidden = ui.view === 'new';
      }

      function renderChapters() {
        const items = SCENARIOS.map((s, i) => {
          const played = ui.log.played.find((p) => p.id === s.id);
          const state = played
            ? 'played'
            : i === ui.log.position && !ui.log.result
              ? 'next'
              : 'later';
          const label = played
            ? played.res === 'none'
              ? 'No resolution'
              : `Resolution ${played.res.slice(1)}`
            : state === 'next'
              ? 'Up next'
              : 'Not played yet';
          return `<button class="chapter" data-state="${state}" data-act="chapter" data-id="${s.id}">
            <span class="num">${s.num}</span><span class="name">${s.name}</span><span class="state">${label}</span></button>`;
        });
        return `<nav id="chapters" aria-label="Scenarios">${items.join('')}</nav>`;
      }

      const isNew = (id) => (ui.fresh.has(id) ? ' new' : '');

      function renderInvestigator(m) {
        const card = INVESTIGATORS[m.key];
        const ticks = (kind, max, filled) =>
          Array.from(
            { length: max },
            (_, i) =>
              `<span class="tick" data-kind="${kind}" ${i < filled ? 'data-filled' : ''}></span>`,
          ).join('');
        const stamp =
          m.fate === 'killed'
            ? '<span class="stamp">Killed</span>'
            : m.fate === 'insane'
              ? '<span class="stamp">Insane</span>'
              : '';
        const seat = ui.log.investigators.indexOf(m) + 1;
        return `<button class="inv box" data-act="investigator" data-key="${m.key}" data-fate="${m.fate}" aria-label="${esc(card.name)}, ${m.xpEarned - m.xpSpent} unspent experience">
          <div class="who"><div><span class="label">Investigator</span><span class="hand">${esc(card.name)}</span></div>${sym(card.cls, 'class-icon')}</div>
          <span class="meta">Seat ${seat}${seat === 1 ? ' · lead' : ''} · health ${card.health} · sanity ${card.sanity}</span>
          <div class="xp"><span class="xp-circle${isNew('xp:' + m.key)}"><span class="hand">${m.xpEarned - m.xpSpent}</span></span>
            <div><span class="label">Unspent Experience</span><span class="meta">${m.xpEarned} earned · ${m.xpSpent} spent</span></div></div>
          <div class="trauma"><span class="label">Physical</span><span class="ticks${isNew('physical:' + m.key)}">${ticks('physical', card.health, m.physical)}</span>
            <span class="label">Mental</span><span class="ticks${isNew('mental:' + m.key)}">${ticks('mental', card.sanity, m.mental)}</span></div>
          <div><span class="label">Earned Story Assets / Weaknesses</span>
            <div class="earned written-line hand${isNew('cards:' + m.key)}">${m.cards.map(esc).join(', ')}</div></div>
          ${stamp}
        </button>`;
      }

      function noteSentence(n) {
        return STORY[n.key][n.value];
      }

      function renderBook() {
        const log = ui.log;
        const former = log.former.length
          ? `<p class="former">Former investigators: ${log.former.map((m) => `<span class="hand">${esc(INVESTIGATORS[m.key].name)}</span> (${m.fate})`).join(', ')}</p>`
          : '';
        const notes = log.notes.length
          ? log.notes
              .map(
                (
                  n,
                ) => `<li class="note${isNew('note:' + n.key)}" ${n.crossed ? 'data-crossed' : ''}>
                  <span class="margin">${n.chapter}</span>
                  <button data-act="note" data-key="${n.key}"><span class="hand">${esc(noteSentence(n))}</span></button></li>`,
              )
              .join('')
          : '<li class="empty-hint">Nothing recorded yet. Resolutions write their records here.</li>';
        const list = (key) =>
          log.lists[key]
            .map((e) => `<li class="hand" ${e.crossed ? 'data-crossed' : ''}>${esc(e.name)}</li>`)
            .join('');
        const counts = {};
        for (const t of log.bag) counts[t] = (counts[t] ?? 0) + 1;
        const bag = TOKEN_ORDER.filter((t) => counts[t])
          .map(
            (t) =>
              `<span class="bag-entry">${token(t)}<span class="hand">${counts[t]}</span></span>`,
          )
          .join('');
        const result = log.result
          ? `<div class="result-banner${isNew('result')}"><span class="label">The campaign is over</span><span class="hand">${esc(log.result)}</span></div>`
          : '';
        return `<div id="book">
          <section class="page" aria-label="Investigators">
            <header class="page-head"><h2>Campaign Log</h2><span class="campaign">Night of the Zealot</span>${FLOURISH}</header>
            ${result}
            <h3 class="section-title">Investigators</h3>
            <div class="investigators">${log.investigators.map(renderInvestigator).join('')}</div>
            ${former}
          </section>
          <section class="page" aria-label="Campaign notes">
            <h3 class="section-title">Campaign Notes</h3>
            <ul class="notes">${notes}</ul>
            <div class="lists">
              <div class="box"><span class="label">Cultists We Interrogated</span><ul class="${isNew('list:interrogated').trim()}">${list('interrogated')}</ul></div>
              <div class="box"><span class="label">Cultists Who Got Away</span><ul class="${isNew('list:gotAway').trim()}">${list('gotAway')}</ul></div>
            </div>
            <h3 class="section-title">Chaos Bag</h3>
            <button class="box bag bag-box" data-act="bag" aria-label="Chaos bag, ${log.bag.length} tokens">${bag}</button>
          </section>
        </div>`;
      }

      function renderNext() {
        let html = '';
        if (ui.view === 'log') {
          const next = nextScenario();
          const out = blocked();
          if (ui.log.result) {
            html = `<div class="next-wrap"><button class="primary" data-act="export">Export the campaign</button><span class="why">The log stays readable from the home screen.</span></div>`;
          } else if (ui.demo === 'gatheringEnded' && ui.log.position === 0) {
            html = `<div class="next-wrap"><button class="primary" data-act="resolve" data-id="gathering">Resolve The Gathering</button><span class="why">The scenario is over. Record its resolution.</span></div>`;
          } else if (next) {
            const why = out.length
              ? `Replace ${out.map((m) => INVESTIGATORS[m.key].name).join(', ')} first.`
              : 'Shows what the log changes in the setup first.';
            html = `<div class="next-wrap"><button class="primary" data-act="setup" ${out.length ? 'disabled' : ''}>Begin Chapter ${next.num}: ${next.name}</button><span class="why">${why}</span></div>`;
          }
        } else if (ui.view === 'new') {
          html = `<div class="next-wrap"><button class="primary" data-act="create" ${ui.newCampaign.team.length ? '' : 'disabled'}>Open the campaign log</button></div>`;
        }
        $('next').innerHTML = html;
      }

      function renderPlaying() {
        const s = nextScenario();
        return `<section class="playing"><h2>Chapter ${s.num}: ${s.name}</h2>
          <p>The play screen opens here (see the play screen prototype). When the scenario ends, the app proposes a resolution from the game and comes back to the log.</p>
          <div class="actions" style="justify-content:center"><button class="secondary" data-act="back-to-log">Back to the log</button>
          <button class="primary" data-act="resolve" data-id="${s.id}">End the scenario (demo)</button></div></section>`;
      }

      function renderNewCampaign() {
        const nc = ui.newCampaign;
        const diffs = Object.keys(BAGS)
          .map(
            (
              d,
            ) => `<button class="choice" role="radio" aria-checked="${nc.difficulty === d}" data-act="difficulty" data-id="${d}">
              <span class="what">${d[0].toUpperCase() + d.slice(1)}</span>
              <span class="bag">${BAGS[d].map((t) => token(t, 18)).join('')}</span></button>`,
          )
          .join('');
        const picks = Object.entries(INVESTIGATORS)
          .map(([key, c]) => {
            const seat = nc.team.indexOf(key);
            return `<button class="pick" role="checkbox" aria-checked="${seat >= 0}" data-act="team" data-key="${key}" ${seat < 0 && nc.team.length >= 4 ? 'disabled' : ''}>
              ${sym(c.cls, 'class-icon')}<span>${esc(c.name)}</span><span class="stats">${seat >= 0 ? `Seat ${seat + 1}` : `health ${c.health} · sanity ${c.sanity}`}</span></button>`;
          })
          .join('');
        return `<div class="title-page"><section class="page">
          <header class="page-head"><h2>A New Campaign</h2><span class="campaign">Night of the Zealot · three chapters</span>${FLOURISH}</header>
          <h3 class="section-title">Difficulty</h3><div class="diff" role="radiogroup">${diffs}</div>
          <h3 class="section-title">Investigators</h3>
          <p class="ui">Pick 1–4 in player order. The first is the lead investigator.</p>
          <div class="pick-grid">${picks}</div>
        </section></div>`;
      }

      // ---------- The desk (the official log sheet's layout) ----------
      /** Hand-drawn tally marks: groups of four strokes crossed by a fifth, as players keep trauma on paper. */
      function tally(n, label) {
        if (!n)
          return `<svg class="tally" viewBox="0 0 10 26" role="img" aria-label="${label}: none"></svg>`;
        let x = 4;
        let d = '';
        const jitter = (i) => ((i * 37) % 7) / 3 - 1;
        for (let i = 0; i < n; i++) {
          const inGroup = i % 5;
          if (inGroup === 4) {
            d += `M${x - 30 + jitter(i)} 19L${x - 2} 6`;
            x += 8;
            continue;
          }
          d += `M${x + jitter(i)} 3L${x + jitter(i + 3) * 0.6} 23`;
          x += 7;
          if (i === n - 1) x += 2;
        }
        return `<svg class="tally" viewBox="0 0 ${x} 26" style="width:${x}px" role="img" aria-label="${label}: ${n}"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>`;
      }
      const CLIP = `<svg class="clip" viewBox="0 0 40 96" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><path d="M30 20v52a12 12 0 01-24 0V12a9 9 0 0118 0v56a5 5 0 01-10 0V22"/></svg>`;
      const RING = `<svg viewBox="0 0 26 52" fill="none" stroke="currentColor" stroke-width="4" aria-hidden="true"><path d="M13 48a9 9 0 01-9-9V13a9 9 0 0118 0v14"/></svg>`;
      const ARROW = `<svg class="arrow" viewBox="0 0 22 30" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M10 2c1 8 0 14 1 22M4 17l7 10 7-11c-4 1-10 1-14 1z"/></svg>`;

      function renderColumn(m) {
        if (!m)
          return `<div class="column" data-empty><div class="field"><span class="label">Player Name</span></div><div class="field"><span class="label">Investigator</span></div>
            <div class="field"><span class="label">Unspent Experience</span></div><div class="field trauma-row"><div><span class="trauma-head"><span class="label">Trauma</span><span class="sub">(Physical)</span></span></div><div><span class="sub">(Mental)</span></div></div>
            <div class="field"><span class="label">Earned Story Assets/<wbr>Weaknesses</span></div></div>`;
        const card = INVESTIGATORS[m.key];
        const unspent = m.xpEarned - m.xpSpent;
        const xp =
          m.xpEarned || m.xpTrail.length
            ? `<span class="xp-line${isNew('xp:' + m.key)}">${m.xpTrail.map((v) => `<span class="hand old">${v}</span>`).join('')}<span class="hand now">${unspent}</span></span>`
            : '';
        const fate =
          m.fate === 'alive'
            ? ''
            : `<span class="fate-note">${m.fate === 'killed' ? 'killed' : 'insane'}</span>`;
        return `<button class="column" data-act="investigator" data-key="${m.key}" data-fate="${m.fate}" aria-label="${esc(card.name)}, ${unspent} unspent experience">
          <div class="field"><span class="label">Player Name</span><span class="hand">${esc(m.player ?? '')}</span></div>
          <div class="field"><span class="label">Investigator</span><span class="who">${sym(card.cls, 'class-icon')}<span class="hand">${esc(card.name)}</span></span>${fate}</div>
          <div class="field"><span class="label">Unspent Experience</span>${xp}</div>
          <div class="field trauma-row">
            <div class="${isNew('physical:' + m.key).trim()}"><span class="trauma-head"><span class="label">Trauma</span><span class="sub">(Physical)</span></span>${tally(m.physical, 'Physical trauma')}</div>
            <div class="${isNew('mental:' + m.key).trim()}"><span class="sub">(Mental)</span>${tally(m.mental, 'Mental trauma')}</div>
          </div>
          <div class="field"><span class="label">Earned Story Assets/<wbr>Weaknesses</span><span class="hand${isNew('cards:' + m.key)}">${m.cards.map(esc).join(', ')}</span></div>
        </button>`;
      }

      function renderDesk() {
        const log = ui.log;
        const columns = [0, 1, 2, 3].map((i) => renderColumn(log.investigators[i])).join('');
        const scenarios = SCENARIOS.map((s, i) => {
          const played = log.played.find((p) => p.id === s.id);
          const state = played ? 'played' : i === log.position && !log.result ? 'next' : 'later';
          const res = played
            ? played.res === 'none'
              ? 'no res.'
              : played.res
            : state === 'next'
              ? '← next'
              : '';
          return `<li>${i ? ARROW : ''}<button class="scenario" data-state="${state}" data-act="chapter" data-id="${s.id}">
            <span class="check" ${played ? 'data-done' : ''}></span><span class="name script">${s.name}</span><span class="res hand">${res}</span></button></li>`;
        }).join('');
        const gone = [...log.investigators, ...log.former].filter((m) => m.fate !== 'alive');
        const left = log.former.filter((m) => m.fate === 'alive');
        const goneItems = gone
          .map(
            (m) =>
              `<li class="hand">${esc(INVESTIGATORS[m.key].name)} – ${m.fate === 'killed' ? 'killed' : 'insane'}${m.player ? ` (${esc(m.player)})` : ''}</li>`,
          )
          .join('');
        const notes = log.notes
          .map(
            (n) =>
              `<li class="${isNew('note:' + n.key).trim()}" ${n.crossed ? 'data-crossed' : ''}><button data-act="note" data-key="${n.key}"><span class="hand">${esc(noteSentence(n))}</span></button></li>`,
          )
          .join('');
        const verdict = log.result
          ? `<li class="verdict${isNew('result')}"><span class="hand">${esc(log.result)}</span></li>`
          : '';
        const list = (key) =>
          log.lists[key]
            .map(
              (e) =>
                `<li class="${isNew('list:' + key).trim()}" ${e.crossed ? 'data-crossed' : ''}><span class="hand">${esc(e.name)}</span></li>`,
            )
            .join('');
        return `<div id="desk"><div class="board">
          <section class="sheet index-card" aria-label="Investigators">${CLIP}
            <header class="card-head"><span class="printed">Campaign Log:</span><h1 class="script">Night of the Zealot</h1></header>
            <div class="frame"><h2 class="frame-title">Investigators</h2><div class="columns">${columns}</div></div>
          </section>
          <section class="sheet napkin" aria-label="Scenarios"><h2 class="script">Scenarios</h2><ol class="scenario-list">${scenarios}</ol></section>
          <section class="sheet clipping" aria-label="Killed and insane investigators"><span class="staple"></span>
            <h2>Killed/Insane Investigators</h2><ul>${goneItems}</ul>
            ${left.length ? `<p class="muted-hint">Left the campaign: ${left.map((m) => esc(INVESTIGATORS[m.key].name)).join(', ')}</p>` : ''}</section>
          <section class="notepad" aria-label="Campaign notes"><div class="rings">${RING}${RING}</div>
            <section><h2 class="script">Campaign Notes</h2><ul>${notes}${verdict}</ul></section>
            <section><h2 class="script">Interrogated Cultists</h2><ul>${list('interrogated')}</ul></section>
            <section><h2 class="script">Cultists Who Got Away</h2><ul>${list('gotAway')}</ul></section>
          </section>
          <p class="copyright">Unofficial fan project. Layout after the campaign log sheet of the Core Set.</p>
        </div></div>`;
      }

      /** Paints the starfield the log sheet lies on, once, as a background image. */
      function paintStars() {
        const c = document.createElement('canvas');
        c.width = 600;
        c.height = 600;
        const g = c.getContext('2d');
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        for (let i = 0; i < 520; i++) {
          const r = rnd() < 0.92 ? rnd() * 0.9 + 0.2 : rnd() * 1.6 + 0.8;
          g.fillStyle = `rgba(${200 + rnd() * 55},${210 + rnd() * 45},255,${0.3 + rnd() * 0.7})`;
          g.beginPath();
          g.arc(rnd() * 600, rnd() * 600, r, 0, Math.PI * 2);
          g.fill();
        }
        document.documentElement.style.setProperty('--stars', `url(${c.toDataURL()})`);
      }

      // ---------- Dialogs ----------
      function renderDialog() {
        const d = ui.dialog;
        $('scrim').hidden = !d;
        if (!d) {
          $('scrim').innerHTML = '';
          return;
        }
        const body =
          d.kind === 'resolve'
            ? renderResolve(d)
            : d.kind === 'investigator'
              ? renderSheet(d)
              : d.kind === 'replace'
                ? renderReplace(d)
                : d.kind === 'setup'
                  ? renderSetup(d)
                  : d.kind === 'note'
                    ? renderNote(d)
                    : d.kind === 'bag'
                      ? renderBag()
                      : '';
        $('scrim').innerHTML =
          `<div class="dialog page" role="dialog" aria-modal="true">${body}</div>`;
      }

      const closeX = '<button class="close" data-act="close" aria-label="Close">×</button>';

      function changeLines(changes) {
        const groups = { notes: [], team: [], byHand: [] };
        for (const c of changes) {
          if (c.kind === 'record')
            groups.notes.push(
              `<div class="change">${PEN}<div><span class="hand">${esc(STORY[c.key][c.value])}</span></div></div>`,
            );
          else if (c.kind === 'strike')
            groups.notes.push(
              `<div class="change" data-kind="strike">${PEN}<div><span class="hand">${esc(STORY[c.key].yes)}</span><div class="why">Crossed out: ${esc(c.why)}</div></div></div>`,
            );
          else if (c.kind === 'list')
            groups.notes.push(
              `<div class="change">${PEN}<div><span class="label">${c.key === 'gotAway' ? 'Cultists Who Got Away' : 'Cultists We Interrogated'}</span><span class="hand">${c.names.map(esc).join(', ')}</span><div class="why">${esc(c.why)}</div></div></div>`,
            );
          else if (c.kind === 'xp')
            groups.team.push(
              `<div class="change">${PEN}<div><span class="hand">+${c.each} experience each</span><div class="why">${esc(c.why)}</div></div></div>`,
            );
          else if (c.kind === 'trauma' && inv(ui.log, c.who))
            groups.team.push(
              `<div class="change">${PEN}<div><span class="hand">${esc(INVESTIGATORS[c.who].name)}: ${c.amount} ${c.trauma} trauma</span><div class="why">${esc(c.why)}</div></div></div>`,
            );
          else if (c.kind === 'earn')
            groups.team.push(
              `<div class="change">${PEN}<div><span class="hand">${esc(INVESTIGATORS[c.who === 'lead' ? ui.log.investigators[0].key : c.who].name)} earns ${esc(c.card)}</span><div class="why">${esc(c.why)}</div></div></div>`,
            );
          else if (c.kind === 'byHand')
            groups.byHand.push(
              `<div class="change" data-kind="byHand">${HAND}<div class="text">${esc(c.text)}</div></div>`,
            );
          else if (c.kind === 'result')
            groups.notes.push(
              `<div class="change">${PEN}<div><span class="hand">${esc(c.text)}</span><div class="why">The campaign ends.</div></div></div>`,
            );
        }
        return `<div class="changes">
          ${groups.notes.length ? `<h4>Campaign Notes</h4>${groups.notes.join('')}` : ''}
          ${groups.team.length ? `<h4>Investigators</h4>${groups.team.join('')}` : ''}
          <h4>Chaos Bag</h4><div class="change">${PEN}<div class="ui">No change.</div></div>
          ${groups.byHand.length ? `<h4>At the table</h4>${groups.byHand.join('')}` : ''}
        </div>`;
      }

      function renderResolve(d) {
        const s = scenarioOf(d.scenario);
        const r = RESOLUTIONS[d.scenario];
        const chosen = r.options.find((o) => o.id === d.choice);
        const steps = `<div class="steps" aria-label="Step ${d.step} of 2"><span ${d.step >= 1 ? 'data-on' : ''}></span><span ${d.step >= 2 ? 'data-on' : ''}></span></div>`;
        if (d.step === 1) {
          const options = r.options
            .map(
              (
                o,
              ) => `<button class="choice" role="radio" aria-checked="${o.id === d.choice}" data-act="pick-res" data-id="${o.id}">
                <span class="rn">${o.rn}</span><span class="what">${esc(o.what)}${o.id === r.proposal ? '<span class="proposed">from the game</span>' : ''}</span>
                <span class="from">${esc(o.from)}</span></button>`,
            )
            .join('');
          return `<span class="kicker">Chapter ${s.num} · ${s.name}</span><h3>The scenario is over</h3>${steps}
            <p class="ui">${esc(r.proposalWhy)} Confirm the resolution, or pick another one if the table played it differently.</p>
            <div class="choices" role="radiogroup">${options}</div>
            <div class="read-aloud">${HAND}<span>Read ${chosen.id === 'none' ? 'the “No resolution” text' : `Resolution ${chosen.id.slice(1)}`} aloud from the campaign guide.</span></div>
            <div class="actions"><button class="secondary" data-act="close">Not yet</button><button class="primary" data-act="res-next">Next</button></div>`;
        }
        const changes = r.changes[d.choice] ?? r.changes[r.proposal];
        return `<span class="kicker">Chapter ${s.num} · ${chosen.id === 'none' ? 'No resolution' : `Resolution ${chosen.id.slice(1)}`}</span><h3>Into the campaign log</h3>${steps}
          ${changeLines(changes)}
          <div class="actions"><button class="secondary" data-act="res-back">Back</button><button class="primary" data-act="res-write">Write into the log</button></div>`;
      }

      function renderSheet(d) {
        const m = inv(ui.log, d.key);
        const card = INVESTIGATORS[m.key];
        const draft = d.adjust ?? m;
        const unspent = draft.xpEarned - draft.xpSpent;
        const ticks = (kind, max, filled) =>
          Array.from(
            { length: max },
            (_, i) =>
              `<span class="tick" data-kind="${kind}" ${i < filled ? 'data-filled' : ''}></span>`,
          ).join('');
        const stepper = (field) =>
          `<span class="stepper"><button data-act="adj" data-field="${field}" data-by="-1" aria-label="Less">−</button><output>${draft[field]}</output><button data-act="adj" data-field="${field}" data-by="1" aria-label="More">+</button></span>`;
        const adjusting = !!d.adjust;
        const fateNote =
          m.fate !== 'alive'
            ? `<div class="warning">${esc(card.name)} was ${m.fate === 'killed' ? 'killed' : 'driven insane'}. Choose a replacement investigator before the next scenario.</div>`
            : '';
        const spend = adjusting
          ? ''
          : `<div class="box"><span class="label">Spend Experience</span>
              <p class="adjust-note">Upgrade your deck at the table, then record what the new cards cost.</p>
              <span class="stepper"><button data-act="spend-by" data-by="-1" aria-label="Less">−</button><output>${d.spend}</output><button data-act="spend-by" data-by="1" aria-label="More">+</button></span>
              <button class="secondary" data-act="spend" ${d.spend ? '' : 'disabled'} style="margin-left:10px">Spend ${d.spend} XP</button></div>`;
        return `${closeX}
          <div class="sheet-head">${sym(card.cls, 'class-icon')}<h3 class="hand" style="font-size:2rem">${esc(card.name)}</h3><span class="adjust-note">${esc(m.player)}${m.player ? ' · ' : ''}seat ${ui.log.investigators.indexOf(m) + 1}</span>
            <span class="adjust-note">Health ${card.health} · sanity ${card.sanity}${m.physical || m.mental ? ` · starts each scenario with ${m.physical} damage and ${m.mental} horror` : ''}</span></div>
          ${fateNote}
          <div class="stat-grid">
            <div class="box"><span class="label">Unspent Experience</span><span class="hand" style="font-size:2.2rem">${unspent}</span>
              ${adjusting ? `<div class="adjust-note">Earned ${stepper('xpEarned')}</div><div class="adjust-note">Spent ${stepper('xpSpent')}</div>` : `<div class="adjust-note">${draft.xpEarned} earned · ${draft.xpSpent} spent</div>`}</div>
            <div class="box"><span class="label">Physical Trauma</span>${tally(draft.physical, 'Physical trauma')}<div class="adjust-note">${draft.physical} of ${card.health} health</div>${adjusting ? stepper('physical') : ''}
              <span class="label" style="margin-top:8px">Mental Trauma</span>${tally(draft.mental, 'Mental trauma')}<div class="adjust-note">${draft.mental} of ${card.sanity} sanity</div>${adjusting ? stepper('mental') : ''}</div>
          </div>
          <div class="box" style="margin-top:12px"><span class="label">Earned Story Assets / Weaknesses</span><div class="written-line hand">${draft.cards.map(esc).join(', ') || '&nbsp;'}</div></div>
          ${spend}
          ${
            adjusting
              ? `<p class="adjust-note">Corrections change the log directly, for mistakes made at the table. Done keeps them as one undo step.</p>
                 <div class="actions"><button class="secondary" data-act="adj-cancel">Cancel</button><button class="primary" data-act="adj-done">Done</button></div>`
              : `<div class="actions">${m.fate !== 'alive' ? '<button class="primary" data-act="replace">Choose a replacement</button>' : '<button class="link" data-act="leave">Player leaves the campaign</button>'}<button class="secondary" data-act="adj-start">Correct the log</button></div>`
          }`;
      }

      function renderReplace(d) {
        const used = new Set([...ui.log.investigators, ...ui.log.former].map((m) => m.key));
        const out = inv(ui.log, d.key);
        const picks = Object.entries(INVESTIGATORS)
          .map(
            ([
              key,
              c,
            ]) => `<button class="pick" role="radio" aria-checked="${d.pick === key}" data-act="pick-inv" data-key="${key}" ${used.has(key) ? 'disabled' : ''}>
              ${sym(c.cls, 'class-icon')}<span>${esc(c.name)}</span><span class="stats">${used.has(key) ? 'Already in this campaign' : `health ${c.health} · sanity ${c.sanity}`}</span></button>`,
          )
          .join('');
        return `${closeX}<span class="kicker">Seat ${ui.log.investigators.indexOf(out) + 1}</span><h3>Replace ${esc(INVESTIGATORS[out.key].name)}</h3>
          <p class="ui">The new investigator joins with a new deck, no trauma and no experience. ${esc(INVESTIGATORS[out.key].name)} stays in the log as a former investigator.</p>
          <div class="pick-grid">${picks}</div>
          <div class="actions"><button class="primary" data-act="replace-confirm" ${d.pick ? '' : 'disabled'}>Join the campaign</button></div>`;
      }

      function renderSetup() {
        const s = nextScenario();
        const log = ui.log;
        const reads = [];
        for (const n of log.notes) {
          const r = READS[n.key];
          if (!r) continue;
          if (r.scenario !== s.id && r.also !== s.id) continue;
          reads.push(
            `<div class="read"><span class="hand" ${n.crossed ? 'style="text-decoration:line-through"' : ''}>${esc(noteSentence(n))}</span><span class="effect">${esc(n.crossed ? r.no : r[n.value])}</span></div>`,
          );
        }
        if (s.id === 'devourer') {
          const away = log.lists.gotAway.filter((e) => !e.crossed);
          reads.push(
            `<div class="read"><span class="label">Cultists Who Got Away</span><span class="hand">${away.map((e) => esc(e.name)).join(', ')}</span>
              <span class="effect">${Math.ceil(away.length / 2)} doom on agenda 1a; each of them is set aside to spawn at the Main Path.</span></div>`,
          );
        }
        for (const m of log.investigators.filter((x) => x.cards.includes('Lita Chantler'))) {
          const name = INVESTIGATORS[m.key].name;
          reads.push(
            `<div class="read"><span class="label">Earned Story Assets</span><span class="hand">${esc(name)}: Lita Chantler</span><span class="effect">${esc(name)} may play Lita from their deck${s.id === 'devourer' ? '; the setup trusts that they control her' : ''}.</span></div>`,
          );
        }
        const team = log.investigators
          .map((m) => {
            const c = INVESTIGATORS[m.key];
            const unspent = m.xpEarned - m.xpSpent;
            return `<div class="team-row">${sym(c.cls, 'class-icon')}<div><span class="hand">${esc(c.name)}</span>
              <div class="ui">${m.physical} damage and ${m.mental} horror from trauma</div></div>
              <button class="link" data-act="investigator" data-key="${m.key}">${unspent} XP unspent</button></div>`;
          })
          .join('');
        const counts = {};
        for (const t of log.bag) counts[t] = (counts[t] ?? 0) + 1;
        return `${closeX}<span class="kicker">Chapter ${s.num}</span><h3>${s.name}</h3>
          <h4 class="section-title">From your campaign log</h4>
          <div class="reads">${reads.join('') || '<p class="ui">Nothing in the log changes this setup.</p>'}</div>
          <h4 class="section-title">Investigators</h4>${team}
          <p class="adjust-note">Spend experience before you start: upgrade your deck at the table, then record the cost.</p>
          <h4 class="section-title">Chaos Bag</h4>
          <div class="bag">${TOKEN_ORDER.filter((t) => counts[t])
            .map(
              (t) =>
                `<span class="bag-entry">${token(t, 28)}<span class="hand">${counts[t]}</span></span>`,
            )
            .join('')}</div>
          <div class="read-aloud">${HAND}<span>Read the introduction of Chapter ${s.num} aloud from the campaign guide.</span></div>
          <div class="actions"><button class="secondary" data-act="close">Not yet</button><button class="primary" data-act="play">Set up and play</button></div>`;
      }

      function renderNote(d) {
        const n = ui.log.notes.find((x) => x.key === d.key);
        const writer = SCENARIOS.find((s) => s.num === n.chapter);
        const played = ui.log.played.find((p) => p.id === writer.id);
        const r = READS[n.key];
        const readers = r ? [r.scenario, r.also].filter(Boolean).map((id) => scenarioOf(id)) : [];
        return `${closeX}<span class="kicker">Campaign note</span>
          <h3 class="hand" style="font-size:1.9rem;${n.crossed ? 'text-decoration:line-through' : ''}">${esc(noteSentence(n))}</h3>
          <div class="reads" style="margin-top:14px">
            <div class="read"><span class="label">Written by</span><span class="ui">Chapter ${writer.num}, ${writer.name} · ${played.res === 'none' ? 'no resolution' : `Resolution ${played.res.slice(1)}`}</span></div>
            ${n.crossed ? `<div class="read"><span class="label">Crossed out by</span><span class="ui">Chapter ${n.crossedIn}, ${SCENARIOS.find((s) => s.num === n.crossedIn).name}</span></div>` : ''}
            ${readers.map((s) => `<div class="read"><span class="label">Read by the setup of</span><span class="ui">Chapter ${s.num}, ${s.name}</span><span class="effect">${esc(n.crossed ? r.no : r[n.value])}</span></div>`).join('')}
          </div>
          <div class="actions"><button class="secondary" data-act="close">Close</button></div>`;
      }

      function renderBag() {
        const counts = {};
        for (const t of ui.log.bag) counts[t] = (counts[t] ?? 0) + 1;
        const entries = TOKEN_ORDER.filter((t) => counts[t])
          .map(
            (t) =>
              `<span class="bag-entry">${token(t, 44)}<span class="hand">${counts[t]}</span></span>`,
          )
          .join('');
        return `${closeX}<span class="kicker">${ui.log.difficulty[0].toUpperCase() + ui.log.difficulty.slice(1)} · ${ui.log.bag.length} tokens</span><h3>Chaos Bag</h3>
          <div class="bag" style="justify-content:center;gap:14px 10px;margin-top:16px">${entries}</div>
          <h4 class="section-title">Changes</h4>
          <div class="reads"><div class="read"><span class="ui">Set up for ${ui.log.difficulty} when the campaign started. Night of the Zealot adds no tokens; later campaigns write their changes here, each with the chapter that made it.</span></div></div>`;
      }

      function renderMenu() {
        const opt = (group, value, label, current) =>
          `<button role="menuitemradio" aria-checked="${current === value}" data-act="${group}" data-id="${value}">${label}</button>`;
        $('menu').innerHTML = `
          <h4>Example</h4>${Object.entries(DEMOS)
            .map(([k, label]) => opt('demo', k, label, ui.demo))
            .join('')}

          <h4>Theme</h4><div class="seg">${opt('theme', 'auto', 'Auto', ui.theme)}${opt('theme', 'dark', 'Dark', ui.theme)}${opt('theme', 'light', 'Light', ui.theme)}</div>`;
      }

      function toast(text, undo) {
        ui.undo = undo;
        $('toast').innerHTML =
          `<span>${esc(text)}</span>${undo ? '<button class="link" data-act="undo">Undo</button>' : ''}`;
        $('toast').hidden = false;
        clearTimeout(toast.timer);
        toast.timer = setTimeout(() => ($('toast').hidden = true), 5000);
      }

      function setDemo(name) {
        ui.demo = name;
        ui.log = demoLog(name);
        ui.fresh = new Set();
        ui.dialog = null;
        ui.view = name === 'newCampaign' ? 'new' : 'log';
        if (name === 'gatheringEnded')
          ui.dialog = {
            kind: 'resolve',
            scenario: 'gathering',
            step: 1,
            choice: RESOLUTIONS.gathering.proposal,
          };
      }

      // ---------- Actions ----------
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-act]');
        if (!el) {
          if (!$('menu').hidden && !e.target.closest('#menu')) $('menu').hidden = true;
          if (
            e.target === $('scrim') &&
            ui.dialog &&
            ui.dialog.kind !== 'resolve' &&
            !ui.dialog.adjust
          ) {
            ui.dialog = null;
            render();
          }
          return;
        }
        const act = el.dataset.act;
        const id = el.dataset.id;
        const key = el.dataset.key;
        const d = ui.dialog;
        if (act === 'menu') {
          $('menu').hidden = !$('menu').hidden;
          return;
        }
        if (act !== 'undo') $('menu').hidden = true;
        switch (act) {
          case 'demo':
            setDemo(id);
            break;
          case 'skin':
            ui.skin = id;
            break;
          case 'theme':
            ui.theme = id;
            break;
          case 'home':
            toast('The home screen lists campaigns and quick games.');
            return;
          case 'export':
            toast('Exports the log and every scenario as one file.');
            return;
          case 'bag':
            ui.dialog = { kind: 'bag' };
            break;
          case 'close':
            ui.dialog = null;
            break;
          case 'chapter': {
            const played = ui.log.played.find((p) => p.id === id);
            const s = scenarioOf(id);
            if (played)
              toast(
                `${s.name}: ${played.res === 'none' ? 'no resolution' : `Resolution ${played.res.slice(1)}`}. Its game stays in the log for replay.`,
              );
            else if (s === nextScenario() && !ui.log.result) ui.dialog = { kind: 'setup' };
            else toast(`${s.name} comes after the chapters before it.`);
            if (!ui.dialog) return;
            break;
          }
          case 'note':
            ui.dialog = { kind: 'note', key };
            break;
          case 'investigator':
            ui.dialog = {
              kind: 'investigator',
              key,
              spend: 0,
              back: d?.kind === 'setup' ? 'setup' : null,
            };
            break;
          case 'spend-by': {
            const m = inv(ui.log, d.key);
            d.spend = Math.max(
              0,
              Math.min(m.xpEarned - m.xpSpent, d.spend + Number(el.dataset.by)),
            );
            break;
          }
          case 'spend': {
            const before = clone(ui.log);
            const m = inv(ui.log, d.key);
            setXp(m, m.xpEarned, m.xpSpent + d.spend);
            ui.fresh = new Set(['xp:' + m.key]);
            toast(`${INVESTIGATORS[m.key].name} spent ${d.spend} XP.`, before);
            d.spend = 0;
            break;
          }
          case 'adj-start':
            d.adjust = clone(inv(ui.log, d.key));
            break;
          case 'adj': {
            const card = INVESTIGATORS[d.key];
            const f = el.dataset.field;
            const max = f === 'physical' ? card.health : f === 'mental' ? card.sanity : 99;
            d.adjust[f] = Math.max(0, Math.min(max, d.adjust[f] + Number(el.dataset.by)));
            d.adjust.xpSpent = Math.min(d.adjust.xpSpent, d.adjust.xpEarned);
            break;
          }
          case 'adj-cancel':
            d.adjust = null;
            break;
          case 'adj-done': {
            const before = clone(ui.log);
            const i = ui.log.investigators.findIndex((m) => m.key === d.key);
            const card = INVESTIGATORS[d.key];
            const a = d.adjust;
            a.fate =
              a.physical >= card.health ? 'killed' : a.mental >= card.sanity ? 'insane' : 'alive';
            const old = ui.log.investigators[i];
            const earned = a.xpEarned;
            const spent = a.xpSpent;
            a.xpEarned = old.xpEarned;
            a.xpSpent = old.xpSpent;
            setXp(a, earned, spent);
            ui.log.investigators[i] = a;
            d.adjust = null;
            ui.fresh = new Set();
            toast('Log corrected.', before);
            break;
          }
          case 'leave': {
            const before = clone(ui.log);
            const m = inv(ui.log, d.key);
            if (ui.log.investigators.length === 1) {
              toast('A campaign needs at least one investigator.');
              return;
            }
            ui.log.investigators = ui.log.investigators.filter((x) => x !== m);
            ui.log.former.push(m);
            ui.dialog = null;
            toast(
              `${INVESTIGATORS[m.key].name} left the campaign. They may rejoin between scenarios.`,
              before,
            );
            break;
          }
          case 'replace':
            ui.dialog = { kind: 'replace', key: d.key, pick: null };
            break;
          case 'pick-inv':
            d.pick = key;
            break;
          case 'replace-confirm': {
            const before = clone(ui.log);
            const i = ui.log.investigators.findIndex((m) => m.key === d.key);
            ui.log.former.push(ui.log.investigators[i]);
            ui.log.investigators[i] = member(d.pick, { player: ui.log.investigators[i].player });
            ui.fresh = new Set(['xp:' + d.pick]);
            ui.dialog = null;
            toast(`${INVESTIGATORS[d.pick].name} joined the campaign.`, before);
            break;
          }
          case 'setup':
            ui.dialog = { kind: 'setup' };
            break;
          case 'play':
            ui.dialog = null;
            ui.view = 'playing';
            window.scrollTo(0, 0);
            break;
          case 'back-to-log':
            ui.view = 'log';
            break;
          case 'resolve':
            ui.dialog = {
              kind: 'resolve',
              scenario: id,
              step: 1,
              choice: RESOLUTIONS[id].proposal,
            };
            break;
          case 'pick-res':
            d.choice = id;
            break;
          case 'res-next':
            d.step = 2;
            break;
          case 'res-back':
            d.step = 1;
            break;
          case 'res-write': {
            const before = clone(ui.log);
            const res = RESOLUTIONS[d.scenario].changes[d.choice]
              ? d.choice
              : RESOLUTIONS[d.scenario].proposal;
            const { log, fresh } = applyResolution(ui.log, d.scenario, res);
            ui.log = log;
            ui.fresh = fresh;
            ui.dialog = null;
            ui.view = 'log';
            if (ui.demo === 'gatheringEnded') ui.demo = 'afterGathering';
            window.scrollTo(0, 0);
            toast(`Written into the log.`, before);
            break;
          }
          case 'undo':
            if (ui.undo) {
              ui.log = ui.undo;
              ui.fresh = new Set();
              ui.undo = null;
              $('toast').hidden = true;
            }
            break;
          case 'difficulty':
            ui.newCampaign.difficulty = id;
            break;
          case 'team': {
            const t = ui.newCampaign.team;
            ui.newCampaign.team = t.includes(key) ? t.filter((k) => k !== key) : [...t, key];
            break;
          }
          case 'create':
            ui.log = freshLog(ui.newCampaign.difficulty, ui.newCampaign.team);
            ui.view = 'log';
            ui.fresh = new Set();
            ui.dialog = { kind: 'setup' };
            ui.demo = 'fresh';
            break;
        }
        render();
      });
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && ui.dialog && ui.dialog.kind !== 'resolve') {
          ui.dialog = null;
          render();
        }
      });

      // Brass ticks on the playmat ring.
      $('ticks').innerHTML = Array.from({ length: 72 }, (_, i) => {
        const a = (i / 72) * Math.PI * 2;
        const r1 = 400,
          r2 = i % 6 ? 410 : 420;
        return `<line x1="${500 + r1 * Math.cos(a)}" y1="${520 + r1 * Math.sin(a)}" x2="${500 + r2 * Math.cos(a)}" y2="${520 + r2 * Math.sin(a)}"/>`;
      }).join('');

      paintStars();
      const params = new URLSearchParams(location.search);
      if (params.get('skin')) ui.skin = params.get('skin');
      if (params.get('theme')) ui.theme = params.get('theme');
      setDemo(params.get('demo') ?? 'afterGathering');
      render();
    </script>
  </body>
</html>
