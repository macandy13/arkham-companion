<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Screencast player</title>
    <!--
      Plays one PR screencast with pause, seeking, step-wise stepping and speed control, which a
      GIF in the PR description cannot offer. Opened from the description as
      player.html?flow=<slug>&v=<commit>&speed=<rate>; written next to the videos by cli.ts.
    -->
    <style>
      :root {
        color-scheme: light dark;
        font-family: system-ui, sans-serif;
      }
      body {
        margin: 0 auto;
        padding: 1rem;
        max-width: 1200px;
      }
      video {
        width: 100%;
        background: #000;
      }
      form {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.5rem;
        align-items: center;
        margin-top: 0.75rem;
      }
      fieldset {
        display: flex;
        gap: 0.75rem;
        border: none;
        padding: 0;
        margin: 0;
      }
      legend {
        float: left;
        margin-right: 0.5rem;
      }
      button {
        font: inherit;
        padding: 0.25rem 0.75rem;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Screencast</h1>
      <video id="video" controls autoplay muted playsinline></video>
      <form id="controls">
        <button type="button" id="back" aria-label="One step back">⏮ Step</button>
        <button type="button" id="toggle">Pause</button>
        <button type="button" id="forward" aria-label="One step forward">Step ⏭</button>
        <fieldset id="speeds">
          <legend>Speed</legend>
        </fieldset>
      </form>
      <p><a id="download">Download the video</a></p>
    </main>
    <script>
      // One recorded step (SCREENCAST_STEP_MS in screencasts.ts), the unit the step buttons seek by.
      const STEP_SECONDS = 0.25;
      const SPEEDS = [0.125, 0.25, 0.5, 1];
      // Filled in by `playerPage` (screencasts.ts) with this push's flows. The page plays only
      // a flow named there, so a crafted link can never make it load or link another URL.
      const RECORDED = {"version":"13b4365","flows":{}};
      const params = new URLSearchParams(location.search);
      const flow = Object.keys(RECORDED.flows).find((slug) => slug === params.get('flow'));
      const requested = Number(params.get('speed'));
      const speed = SPEEDS.find((rate) => rate === requested) ?? 0.25;
      const video = document.getElementById('video');
      const toggle = document.getElementById('toggle');

      document.getElementById('title').textContent = flow ? RECORDED.flows[flow] : 'No flow given';
      if (flow) {
        const source = `${flow}.webm?v=${RECORDED.version}`;
        document.getElementById('download').href = source;
        video.src = source;
      }
      video.defaultPlaybackRate = speed;
      video.playbackRate = speed;

      for (const rate of SPEEDS) {
        const label = document.createElement('label');
        const input = Object.assign(document.createElement('input'), {
          type: 'radio',
          name: 'speed',
          value: String(rate),
          checked: rate === speed,
        });
        input.addEventListener('change', () => (video.playbackRate = rate));
        label.append(input, ` ${rate}×`);
        document.getElementById('speeds').append(label);
      }

      const showState = () => (toggle.textContent = video.paused ? 'Play' : 'Pause');
      video.addEventListener('play', showState);
      video.addEventListener('pause', showState);
      toggle.addEventListener('click', () => (video.paused ? video.play() : video.pause()));
      const seek = (delta) => {
        video.pause();
        video.currentTime = Math.max(0, video.currentTime + delta);
      };
      document.getElementById('back').addEventListener('click', () => seek(-STEP_SECONDS));
      document.getElementById('forward').addEventListener('click', () => seek(STEP_SECONDS));
    </script>
  </body>
</html>
