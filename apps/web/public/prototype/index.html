    <h3>Game log</h3>
    <ul class="log">${S.log
      .slice()
      .reverse()
      .map((e) => `<li><span>R${e.r}</span>${esc(e.t)}</li>`)
      .join('')}</ul>
    <div class="row"><button class="btn" data-act="restart">Restart the prototype</button></div>
    <p class="fan">Unofficial fan project, not produced or endorsed by Fantasy Flight Games. Arkham Horror: The Card Game and its card images are © Fantasy Flight Games; the pictures are loaded from <a href="https://arkhamdb.com" target="_blank" rel="noopener">ArkhamDB</a> on your device and never shipped with the app.</p>`),
        );
      }
      function showDrawPicker() {
        openSheet(() =>
          sheet(`<span class="kicker">Preview</span><h2>Draw which card?</h2>
    <p>The card goes to the investigator whose turn it is (or the first one), as if drawn in the Mythos phase.</p>
    <div class="pickgrid">${ENCOUNTER.map((c) => `<button data-predraw="${c}"><span class="mini">${face(c, false, { small: true })}</span>${esc(C[c].name)}</button>`).join('')}</div>`),
        );
      }

      /* ================= Skill tests and the chaos bag ================= */
      function startTest(t) {
        let commit = 0,
          tokens = null,
          revealing = false;
        const i = inv(t.inv);
        const ghouls = () => S.enemies.filter((e) => e.loc === i.loc && C[e.code].ghoul).length;
        const effect = (tok) => {
          if (tok === 'skull')
            return { mod: -ghouls(), why: `Skull: −1 per Ghoul at your location (${ghouls()})` };
          if (tok === 'cultist')
            return { mod: -1, why: 'Cultist: −1 and reveal another token', again: true };
          if (tok === 'tablet')
            return {
              mod: -2,
              why: `Tablet: −2${ghouls() ? ', and 1 horror because a Ghoul is here' : ''}`,
              horror: ghouls() ? 1 : 0,
            };
          if (tok === 'fail') return { mod: 0, why: 'Auto-fail', fail: true };
          if (tok === 'elder')
            return {
              mod: i.elder,
              why: `Elder sign: ${i.name.split(' ')[0]}'s ability, +${i.elder}`,
            };
          return { mod: Number(tok), why: '' };
        };
        const draw = () => {
          const first = BAG[Math.floor(Math.random() * BAG.length)];
          const out = [{ tok: first, ...effect(first) }];
          if (out[0].again) {
            const rest = BAG.filter((x) => x !== 'cultist');
            const second = rest[Math.floor(Math.random() * rest.length)];
            out.push({ tok: second, ...effect(second) });
          }
          return out;
        };
        const sign = (n) => (n >= 0 ? `+${n}` : `−${-n}`);
        openSheet(function paint() {
          const base = i.skills[t.skill];
          let calc,
            result = '';
          if (tokens) {
            const fail = tokens.some((x) => x.fail);
            const mod = tokens.reduce((n, x) => n + x.mod, 0);
            const total = Math.max(0, base + commit + mod);
            const pass = !fail && total >= t.difficulty;
            const by = pass ? 0 : fail ? Math.max(1, t.difficulty) : t.difficulty - total;
            const horror = tokens.reduce((n, x) => n + (x.horror || 0), 0);
            calc = `<div class="calc" aria-label="Calculation">
        <div class="term"><b>${base}</b><span>${t.skill}</span></div>
        <span class="op">+</span><div class="term"><b>${commit}</b><span>committed</span></div>
        ${tokens.map((x) => `<span class="op">+</span><div class="term">${tokenSvg(x.tok)}<span>${x.fail ? 'auto-fail' : sign(x.mod)}</span></div>`).join('')}
        <span class="op">=</span><div class="term total"><b>${fail ? '—' : total}</b><span>total</span></div>
        <span class="op">vs</span><div class="term"><b>${t.difficulty}</b><span>${esc(t.against)}</span></div></div>`;
            result = `<div class="verdict ${pass ? 'pass' : 'failv'}">${pass ? (total > t.difficulty ? `Success by ${total - t.difficulty}` : 'Success') : fail ? 'Automatic failure' : `Failed by ${by}`}</div>
        ${
          tokens.some((x) => x.why)
            ? `<p class="note">${tokens
                .filter((x) => x.why)
                .map((x) => esc(x.why))
                .join('<br>')}</p>`
            : ''
        }
        <div class="row"><button class="btn primary" data-test-done="${pass ? 'pass' : 'fail'}:${by}:${horror}">${esc(pass ? t.passLabel : t.failLabel)}</button></div>`;
          } else {
            calc = `<div class="calc"><div class="term"><b>${base}</b><span>${t.skill}</span></div><span class="op">+</span><div class="term"><b>${commit}</b><span>committed</span></div>
        <span class="op">+</span><div class="term"><b>?</b><span>token</span></div><span class="op">vs</span><div class="term"><b>${t.difficulty}</b><span>${esc(t.against)}</span></div></div>`;
          }
          sheet(
            `<span class="kicker">Skill test · ${esc(i.name)}</span><h2>${esc(t.title)}</h2>${calc}
      ${tokens ? '' : `<div class="stepper"><span>Skill icons on committed cards</span><button class="cbtn" data-commit="-">−</button><span class="v">${commit}</span><button class="cbtn" data-commit="+">+</button></div>`}
      <div class="bag">${tokens ? `<div class="tokens">${tokens.map((x) => tokenSvg(x.tok, revealing ? 'spin' : '')).join('')}</div>` : '<button class="btn primary" data-reveal-token style="min-height:56px;padding:0 28px">Reveal chaos token</button>'}</div>
      ${result}`,
            { locked: !!tokens || !!t.locked },
          );
          const m = document.getElementById('modal');
          m.querySelectorAll('[data-commit]').forEach(
            (b) =>
              (b.onclick = () => {
                commit = Math.max(0, commit + (b.dataset.commit === '+' ? 1 : -1));
                paint();
              }),
          );
          const rv = m.querySelector('[data-reveal-token]');
          if (rv)
            rv.onclick = () => {
              tokens = draw();
              revealing = true;
              paint();
              revealing = false;
            };
          const done = m.querySelector('[data-test-done]');
          if (done)
            done.onclick = () => {
              const [res, by, hor] = done.dataset.testDone.split(':');
              closeSheet();
              step(null, () => {
                if (Number(hor)) {
                  i.horror += Number(hor);
                  log(`${i.name} takes 1 horror from the Tablet.`);
                }
                res === 'pass' ? t.onPass() : t.onFail(Number(by));
                checkDefeat(i);
              });
              afterStep();
              if (t.then) t.then();
            };
        });
      }

      /* ================= Actions ================= */
      function investigate(i) {
        const loc = i.loc,
          c = C[S.locations[loc].code];
        startTest({
          inv: i.id,
          skill: 'intellect',
          difficulty: shroud(loc),
          against: 'shroud',
          title: `Investigate the ${c.name}`,
          passLabel: 'Discover 1 clue',
          failLabel: 'Done',
          onPass: () => {
            i.actions -= 1;
            S.locations[loc].clues -= 1;
            i.clues += 1;
            log(`${i.name} investigates the ${c.name} and discovers 1 clue.`);
            const fog = S.locations[loc].attach.indexOf('01168');
            if (fog >= 0) {
              S.locations[loc].attach.splice(fog, 1);
              S.discard.push('01168');
              log('Obscuring Fog is discarded.');
            }
          },
          onFail: () => {
            i.actions -= 1;
            log(`${i.name} investigates the ${c.name} and finds nothing.`);
          },
        });
      }
      function fight(i, e) {
        const c = C[e.code];
        startTest({
          inv: i.id,
          skill: 'combat',
          difficulty: c.fight,
          against: 'fight',
          title: `Fight the ${c.name}`,
          passLabel: 'Deal 1 damage',
          failLabel: 'Done',
          onPass: () => {
            i.actions -= 1;
            e.damage += 1;
            log(`${i.name} hits the ${c.name} for 1 damage.`);
            checkEnemy(e);
          },
          onFail: () => {
            i.actions -= 1;
            log(`${i.name} misses the ${c.name}.`);
          },
        });
      }
      function evade(i, e) {
        const c = C[e.code];
        startTest({
          inv: i.id,
          skill: 'agility',
          difficulty: c.evade,
          against: 'evade',
          title: `Evade the ${c.name}`,
          passLabel: 'Exhaust and disengage',
          failLabel: 'Done',
          onPass: () => {
            i.actions -= 1;
            e.exhausted = true;
            e.engaged = null;
            log(`${i.name} evades the ${c.name}.`);
          },
          onFail: () => {
            i.actions -= 1;
            log(`${i.name} fails to evade the ${c.name}.`);
          },
        });
      }
      function checkEnemy(e) {
        const c = C[e.code];
        if (e.damage >= c.health * (c.elite ? players() / 2 : 1)) {
          S.enemies = S.enemies.filter((x) => x !== e);
          if (c.elite) S.victory.push(e.code);
          else S.discard.push(e.code);
          log(`The ${c.name} is defeated.`);
          toast(`${c.name} defeated`);
        }
      }
      function checkDefeat(i) {
        if (!i.defeated && (i.damage >= i.health || i.horror >= i.sanity)) {
          i.defeated = true;
          S.enemies.forEach((e) => {
            if (e.engaged === i.id) e.engaged = null;
          });
          log(`${i.name} is defeated.`);
          toast(`${i.name} is defeated`);
        }
      }
      /* Moving away from a ready engaged enemy provokes its attack of opportunity; engaged enemies follow. */
      function moveTo(i, key) {
        const l = S.locations[key];
        if (!connected(i.loc, key) || l.blocked || i.actions < 1) return;
        ui.moving = null;
        step(null, () => {
          i.actions -= 1;
          S.enemies
            .filter((e) => e.engaged === i.id && !e.exhausted)
            .forEach((e) => {
              i.damage += C[e.code].dmg;
              i.horror += C[e.code].hor;
              log(
                `Attack of opportunity: the ${C[e.code].name} deals ${C[e.code].dmg} damage and ${C[e.code].hor} horror to ${i.name}.`,
              );
              toast(`${C[e.code].name} attacks as ${i.name.split(' ')[0]} leaves`);
            });
          S.enemies.forEach((e) => {
            if (e.engaged === i.id) e.loc = key;
          });
          i.loc = key;
          log(`${i.name} moves to the ${C[l.code].name}.`);
          if (!l.revealed) reveal(key);
          S.enemies.forEach((e) => {
            if (e.loc === key && !e.engaged && !e.exhausted) {
              e.engaged = i.id;
              log(`The ${C[e.code].name} engages ${i.name}.`);
            }
          });
          checkDefeat(i);
        });
      }
      function reveal(key) {
        const l = S.locations[key];
        l.revealed = true;
        l.clues += C[l.code].clues * players();
        log(`The ${C[l.code].name} is revealed: ${C[l.code].clues * players()} clues placed.`);
      }
      function endTurn(i) {
        step(`${i.name} ends their turn.`, () => {
          i.done = true;
          i.actions = 0;
          const next = S.investigators.findIndex((x, n) => n > S.turn && !x.done && !x.defeated);
          if (next >= 0) S.turn = next;
        });
      }
      function afterStep() {
        const ti = turnInv();
        if (ti && ti.actions === 0 && !ti.done)
          toast(`${ti.name.split(' ')[0]} has no actions left: end the turn`);
      }

      function advanceAct() {
        const ac = S.act.code;
        const need = actNeed();
        if (need == null || S.act.clues < need) return;
        step(null, () => {
          S.act.clues = 0;
          if (ac === '01108') {
            S.act.code = '01109';
            log('Act 1 advances.');
          } else if (ac === '01109') {
            S.act.code = '01110';
            S.locations.parlor.blocked = false;
            reveal('parlor');
            const priest = {
              uid: 'e' + uid++,
              code: '01116',
              loc: 'hallway',
              engaged: null,
              damage: 0,
              exhausted: false,
            };
            const here = S.investigators.find((i) => i.loc === 'hallway' && !i.defeated);
            if (here) priest.engaged = here.id;
            S.enemies.push(priest);
            log(
              'Act 2 advances: the Parlor is revealed with Lita Chantler in it, and the Ghoul Priest spawns in the Hallway.',
            );
          }
        });
        flipState = {};
        openSheet(() =>
          sheet(
            `<span class="kicker">Act advanced</span><h2>${esc(C[ac].name)}</h2>${zoomCard(ac, { key: 'adv', back: true })}
    <p class="story">Read the story on the back of the card aloud.</p>
    <p class="note">${ac === '01109' ? 'Done by the app: Parlor revealed, Lita Chantler put into play there, Ghoul Priest spawned in the Hallway. Hand Lita to whoever takes control of her.' : 'Done by the app.'}</p>
    <div class="row"><button class="btn primary" data-close>Continue</button></div>`,
            { locked: true },
          ),
        );
      }
      function advanceAgenda() {
        const ag = S.agenda.code;
        const next = { '01105': '01106', '01106': '01107' }[ag];
        step(null, () => {
          S.agenda.doom = 0;
          Object.values(S.locations).forEach((l) => {
            l.doom = 0;
          });
          if (next) S.agenda.code = next;
          log(
            `Agenda ${C[ag].stage} advances${next ? '' : ': the investigators are defeated (resolution)'}.`,
          );
        });
        flipState = {};
        openSheet(() =>
          sheet(
            `<span class="kicker">Agenda advanced</span><h2>${esc(C[ag].name)}</h2>${zoomCard(ag, { key: 'adv', back: true })}
    <p class="story">Read the story on the back of the card aloud.</p>
    ${ag === '01106' ? '<p class="note">Each investigator discards encounter cards until a Ghoul enemy is discarded, then draws it. The app does the searching.</p><div class="row"><button class="btn primary" data-ghoul-search>Find a Ghoul for each</button></div>' : '<div class="row"><button class="btn primary" data-after-agenda>Continue</button></div>'}`,
            { locked: true },
          ),
        );
      }

      /* ================= Phases ================= */
      function nextPhase() {
        if (S.phase === 'investigation') {
          step('Enemy phase.', () => {
            S.phase = 'enemy';
          });
          enemyPhase();
        } else if (S.phase === 'enemy') {
          step(
            'Upkeep: investigators and enemies ready, each investigator gains 1 resource and draws 1 card.',
            () => {
              S.phase = 'upkeep';
              S.enemies.forEach((e) => {
                e.exhausted = false;
              });
              S.investigators.forEach((i) => {
                if (!i.defeated) i.resources += 1;
                const dv = i.threat.indexOf('01165');
                if (dv >= 0) {
                  i.threat.splice(dv, 1);
                  S.discard.push('01165');
                  log(`Dissonant Voices leaves ${i.name}'s threat area.`);
                }
              });
            },
          );
          toast('Each investigator draws 1 card from their own deck');
        } else if (S.phase === 'upkeep') {
          step(null, () => {
            S.round += 1;
            S.phase = 'mythos';
            S.agenda.doom += 1;
            log(`Round ${S.round}. Mythos: 1 doom on ${C[S.agenda.code].name}.`);
          });
          if (totalDoom() >= C[S.agenda.code].doom) advanceAgenda();
          else mythosDraws();
        } else if (S.phase === 'mythos') {
          step('Investigation phase.', () => {
            S.phase = 'investigation';
            S.investigators.forEach((i) => {
              i.done = i.defeated;
              i.actions = i.defeated ? 0 : 3;
            });
            S.turn = S.investigators.findIndex((i) => !i.defeated);
          });
        }
      }
      function drawCard() {
        let code;
        step(null, () => {
          if (!S.deck.length) {
            S.deck = shuffle(S.discard);
            S.discard = [];
            log('The encounter deck is reshuffled.');
          }
          code = S.deck.pop();
        });
        return code;
      }
      function mythosDraws() {
        const queue = S.investigators.filter((i) => !i.defeated).map((i) => i.id);
        const drawNext = () => {
          const id = queue.shift();
          if (!id) {
            closeSheet();
            toast('Mythos done: tap Investigate to start the turns');
            return;
          }
          revealEncounter(inv(id), drawCard(), drawNext);
        };
        drawNext();
      }
      function revealEncounter(i, code, then) {
        flipState = {};
        const c = C[code];
        const what =
          c.type === 'enemy'
            ? `Spawns ${c.spawn && S.locations[c.spawn].revealed ? `in the ${C[S.locations[c.spawn].code].name}` : `engaged with ${esc(i.name)}`}.${c.hunter ? ' Hunter.' : ''}`
            : c.test
              ? `Test ${c.test[0]} (${c.test[1]}).`
              : c.threat
                ? `Goes into ${esc(i.name)}'s threat area.`
                : c.doom
                  ? 'Place 1 doom on the agenda.'
                  : c.attach
                    ? `Attaches to the ${C[S.locations[i.loc].code].name}: ${c.attach}.`
                    : '';
        openSheet(() =>
          sheet(
            `<span class="kicker">Encounter card · drawn by ${esc(i.name)}</span><h2>${esc(c.name)}</h2>
    ${zoomCard(code)}<p class="note">${what}</p>
    <div class="row"><button class="btn primary" data-resolve>${c.type === 'enemy' ? 'Spawn' : c.test ? 'Start the test' : 'Resolve'}</button></div>`,
            { locked: true },
          ),
        );
        document.querySelector('[data-resolve]').onclick = () => {
          if (c.type === 'enemy') {
            closeSheet();
            step(null, () => {
              const loc = c.spawn && S.locations[c.spawn].revealed ? c.spawn : i.loc;
              const here = S.investigators.find((x) => x.loc === loc && !x.defeated);
              S.enemies.push({
                uid: 'e' + uid++,
                code,
                loc,
                engaged: here ? here.id : null,
                damage: 0,
                exhausted: false,
              });
              log(
                `${i.name} draws the ${c.name}: it spawns in the ${C[S.locations[loc].code].name}${here ? `, engaged with ${here.name}` : ''}.`,
              );
            });
            then();
          } else if (c.test) {
            startTest({
              inv: i.id,
              skill: c.test[0],
              difficulty: c.test[1],
              against: c.name,
              title: c.name,
              locked: true,
              passLabel: 'No effect',
              failLabel: c.perPoint ? `Take ${c.perPoint}` : 'Apply',
              then,
              onPass: () => {
                S.discard.push(code);
                log(`${i.name} passes ${c.name}.`);
              },
              onFail: (by) => {
                S.discard.push(code);
                if (c.perPoint) {
                  i[c.perPoint] += by;
                  log(`${i.name} fails ${c.name} by ${by} and takes ${by} ${c.perPoint}.`);
                } else {
                  log(`${i.name} fails ${c.name}. By hand: ${c.byHand}`);
                  toast(`Do this by hand: ${c.byHand}`);
                }
              },
            });
          } else {
            closeSheet();
            step(null, () => {
              if (c.threat) {
                i.threat.push(code);
                log(`${c.name} goes into ${i.name}'s threat area.`);
              } else if (c.doom) {
                S.agenda.doom += 1;
                S.discard.push(code);
                log(`${c.name}: 1 doom on the agenda.`);
              } else if (c.attach) {
                S.locations[i.loc].attach.push(code);
                log(`${c.name} attaches to the ${C[S.locations[i.loc].code].name}.`);
              }
            });
            then();
          }
        };
      }
      function enemyPhase() {
        const hunters = [];
        step(null, () => {
          S.enemies.forEach((e) => {
            if (!C[e.code].hunter || e.engaged || e.exhausted) return;
            const target = S.investigators.find((i) => !i.defeated && connected(e.loc, i.loc));
            if (target) {
              e.loc = target.loc;
              e.engaged = target.id;
              hunters.push(
                `${C[e.code].name} hunts ${target.name} into the ${C[S.locations[target.loc].code].name}`,
              );
              log(
                `Hunter: the ${C[e.code].name} moves to the ${C[S.locations[target.loc].code].name} and engages ${target.name}.`,
              );
            }
          });
        });
        const attacks = S.enemies.filter((e) => e.engaged && !e.exhausted);
        openSheet(() =>
          sheet(
            `<span class="kicker">Enemy phase</span><h2>${attacks.length ? 'Enemies attack' : 'No attacks'}</h2>
    ${hunters.length ? `<p class="note">${hunters.map(esc).join('<br>')}</p>` : ''}
    ${attacks.map((e) => `<div class="stepper"><span class="threat-item">${pawnHtml('enemy', e.code, 'tabindex="-1"')}</span><span style="flex:1">${esc(C[e.code].name)} → ${esc(inv(e.engaged).name)}</span><b>${C[e.code].dmg} dmg · ${C[e.code].hor} hor</b></div>`).join('')}
    <p class="story">${attacks.length ? 'Each attacking enemy exhausts after its attack. Soak damage on your assets by hand, then lower the numbers in adjust mode if you did.' : 'Nothing is engaged with an investigator.'}</p>
    <div class="row"><button class="btn primary" data-apply-attacks>${attacks.length ? 'Apply attacks' : 'Continue'}</button></div>`,
            { locked: true },
          ),
        );
        document.querySelector('[data-apply-attacks]').onclick = () => {
          closeSheet();
          step(null, () => {
            attacks.forEach((e) => {
              const i = inv(e.engaged);
              i.damage += C[e.code].dmg;
              i.horror += C[e.code].hor;
              e.exhausted = true;
              log(
                `The ${C[e.code].name} attacks ${i.name}: ${C[e.code].dmg} damage, ${C[e.code].hor} horror.`,
              );
              checkDefeat(i);
            });
          });
        };
      }

      function toast(msg) {
        const el = document.createElement('div');
        el.className = 'toast';
        el.textContent = msg;
        document.getElementById('toasts').appendChild(el);
        setTimeout(() => el.remove(), 3200);
      }

      /* ================= Input ================= */
      document.addEventListener('click', (ev) => {
        const t = ev.target.closest('button, [data-scrim]');
        if (!t) return;
        const d = t.dataset;
        if (d.scrim === 'close' && ev.target === t) {
          closeSheet();
          flipState = {};
          return;
        }
        if (d.scrim) return;
        if ('close' in d) {
          closeSheet();
          flipState = {};
          render();
          return;
        }
        if (d.flip) {
          flipState[d.flip] = !(flipState[d.flip] ?? d.default === '1');
          ui.sheet && ui.sheet();
          return;
        }
        if (d.look) {
          look = d.look;
          try {
            localStorage.setItem('look', look);
          } catch (e) {
            console.warn('Could not store the look', e);
          }
          render();
          return;
        }
        if (d.zoom === 'agenda') return showAgenda();
        if (d.zoom === 'act') return showAct();
        if (d.zoom === 'scenario') return showScenario();
        if (d.zoomInv) return showInvestigator(d.zoomInv);
        if (d.locHit) {
          if (ui.moving) {
            const i = inv(ui.moving);
            if (connected(i.loc, d.locHit) && !S.locations[d.locHit].blocked)
              return moveTo(i, d.locHit);
          }
          return showLocation(d.locHit);
        }
        if (d.edit) return showLocation(d.edit);
        if (d.enemy) return showEnemy(d.enemy);
        if (d.card) return showCard(d.card);
        if (d.pawn) return showInvestigator(d.pawn);
        if (d.predraw) {
          const i = turnInv() || S.investigators.find((x) => !x.defeated);
          const code = d.predraw;
          step(null, () => {
            const k = S.deck.indexOf(code);
            if (k >= 0) S.deck.splice(k, 1);
          });
          return revealEncounter(i, code, () => {});
        }
        switch (d.act) {
          case 'doom+':
            return step(`1 doom placed on ${C[S.agenda.code].name}.`, () => {
              S.agenda.doom += 1;
            });
          case 'doom-':
            return (
              S.agenda.doom > 0 &&
              step(`1 doom removed from ${C[S.agenda.code].name}.`, () => {
                S.agenda.doom -= 1;
              })
            );
          case 'actclue+':
            return step('1 clue added to the act.', () => {
              S.act.clues += 1;
            });
          case 'actclue-':
            return (
              S.act.clues > 0 &&
              step('1 clue removed from the act.', () => {
                S.act.clues -= 1;
              })
            );
          case 'advance-act':
            return advanceAct();
          case 'advance-agenda':
            return advanceAgenda();
          case 'deck':
            return toast(
              `${S.deck.length} cards in the encounter deck. The app draws them in the Mythos phase.`,
            );
          case 'discard':
            return showDiscard();
          case 'next':
            return nextPhase();
          case 'undo':
            return undo();
          case 'menu':
            return showMenu();
          case 'edit':
            return startEdit();
          case 'edit-done':
            return finishEdit(true);
          case 'edit-cancel':
            return finishEdit(false);
          case 'preview-draw':
            return showDrawPicker();
          case 'restart':
            S = initialState();
            undoStack.length = 0;
            closeSheet();
            render();
            return toast('Back to round 2');
          case 'cancel-move':
            ui.moving = null;
            return render();
        }
        if (d.adj) {
          const [id, field, dir] = d.adj.split(':');
          const i = inv(id);
          if (dir === '-' && i[field] <= 0) return;
          return step(`${i.name}: ${field} ${dir === '+' ? '+1' : '−1'}.`, () => {
            i[field] += dir === '+' ? 1 : -1;
            checkDefeat(i);
          });
        }
        if (d.locadj) {
          const [key, field, dir] = d.locadj.split(':');
          const l = S.locations[key];
          if (dir === '-' && l[field] <= 0) return;
          return step(`${C[l.code].name}: ${field} ${dir === '+' ? '+1' : '−1'}.`, () => {
            l[field] += dir === '+' ? 1 : -1;
          });
        }
        if (d.reveal) return step(null, () => reveal(d.reveal));
        if (d.moveto) {
          closeSheet();
          return moveTo(turnInv(), d.moveto);
        }
        if (d.give) {
          const i = inv(d.give);
          return (
            i.clues &&
            step(`${i.name} places 1 clue on the act.`, () => {
              i.clues -= 1;
              S.act.clues += 1;
            })
          );
        }
        if (d.edmg) {
          const [id, dir] = d.edmg.split(':');
          const e = S.enemies.find((x) => x.uid === id);
          if (dir === '-' && !e.damage) return;
          return step(`${C[e.code].name}: damage ${dir}1.`, () => {
            e.damage += dir === '+' ? 1 : -1;
            checkEnemy(e);
          });
        }
        if (d.defeat) {
          const e = S.enemies.find((x) => x.uid === d.defeat);
          closeSheet();
          return step(`${C[e.code].name} defeated.`, () => {
            e.damage = 99;
            checkEnemy(e);
          });
        }
        if (d.fight) {
          const e = S.enemies.find((x) => x.uid === d.fight);
          return fight(turnInv(), e);
        }
        if (d.evade) {
          const e = S.enemies.find((x) => x.uid === d.evade);
          return evade(turnInv(), e);
        }
        if (d.engage) {
          const e = S.enemies.find((x) => x.uid === d.engage);
          closeSheet();
          return step(`${turnInv().name} engages the ${C[e.code].name}.`, () => {
            turnInv().actions -= 1;
            e.engaged = turnInv().id;
          });
        }
        if ('afterAgenda' in d) {
          closeSheet();
          flipState = {};
          if (S.phase === 'mythos') return mythosDraws();
          return render();
        }
        if ('ghoulSearch' in d) {
          closeSheet();
          step(null, () => {
            S.investigators
              .filter((i) => !i.defeated)
              .forEach((i) => {
                const idx = S.deck.findIndex((c) => C[c].ghoul);
                if (idx < 0) return;
                const [code] = S.deck.splice(idx, 1);
                const loc =
                  C[code].spawn && S.locations[C[code].spawn].revealed ? C[code].spawn : i.loc;
                S.enemies.push({
                  uid: 'e' + uid++,
                  code,
                  loc,
                  engaged: loc === i.loc ? i.id : null,
                  damage: 0,
                  exhausted: false,
                });
                log(`${i.name} finds the ${C[code].name}.`);
              });
          });
          return S.phase === 'mythos' ? mythosDraws() : undefined;
        }
        if (d.do) {
          const i = inv(d.inv);
          if (d.do === 'investigate') return investigate(i);
          if (d.do === 'move') {
            ui.moving = ui.moving ? null : i.id;
            render();
            return;
          }
          if (d.do === 'end') return endTurn(i);
          const here =
            d.do === 'fight' ? enemiesAt(i.loc) : S.enemies.filter((e) => e.engaged === i.id);
          if (here.length === 1) return d.do === 'fight' ? fight(i, here[0]) : evade(i, here[0]);
          return openSheet(() =>
            sheet(`<span class="kicker">${d.do === 'fight' ? 'Fight' : 'Evade'}</span><h2>Which enemy?</h2>
      <div class="threat">${here.map((e) => `<span class="threat-item">${pawnHtml('enemy', e.code, `data-${d.do}="${e.uid}"`)}${esc(C[e.code].name)}</span>`).join('')}</div>`),
          );
        }
      });

      /* Drag the investigator whose turn it is onto a connected location, like moving the token on the table. */
      let suppressClick = false;
      document.addEventListener('pointerdown', (ev) => {
        const p = ev.target.closest('.pawn.active[data-pawn]');
        if (!p) return;
        const i = inv(p.dataset.pawn);
        const start = { x: ev.clientX, y: ev.clientY };
        let ghost = null;
        const onMove = (e) => {
          if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) < 8) return;
          if (!ghost) {
            ghost = p.cloneNode(true);
            ghost.classList.add('ghost');
            ghost.style.width = p.offsetWidth + 'px';
            document.body.appendChild(ghost);
            document
              .querySelectorAll('.loc')
              .forEach((l) =>
                l.classList.toggle(
                  'target',
                  connected(i.loc, l.dataset.loc) && !S.locations[l.dataset.loc].blocked,
                ),
              );
          }
          ghost.style.left = e.clientX + 'px';
          ghost.style.top = e.clientY + 'px';
        };
        const onUp = (e) => {
          window.removeEventListener('pointermove', onMove);
          window.removeEventListener('pointerup', onUp);
          if (!ghost) return;
          ghost.remove();
          const loc = document
            .elementsFromPoint(e.clientX, e.clientY)
            .map((el) => el.closest('.loc'))
            .find(Boolean);
          suppressClick = true;
          setTimeout(() => {
            suppressClick = false;
          }, 50);
          if (loc && connected(i.loc, loc.dataset.loc)) moveTo(i, loc.dataset.loc);
          else render();
        };
        window.addEventListener('pointermove', onMove);
        window.addEventListener('pointerup', onUp);
      });
      document.addEventListener(
        'click',
        (e) => {
          if (suppressClick) {
            e.stopPropagation();
            e.preventDefault();
          }
        },
        true,
      );
      window.addEventListener('resize', () => requestAnimationFrame(drawLines));

      /* ================= Background: night sky, brass zodiac ring, a few tentacles ================= */
      function paintMat() {
        const cv = document.getElementById('matcanvas');
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = cv.clientWidth,
          h = cv.clientHeight;
        cv.width = w * dpr;
        cv.height = h * dpr;
        const g = cv.getContext('2d');
        g.scale(dpr, dpr);
        const brass = getComputedStyle(document.documentElement).getPropertyValue('--brass').trim();
        let seed = 7;
        const rnd = () => {
          seed = (seed * 16807) % 2147483647;
          return seed / 2147483647;
        };
        const sky = g.createRadialGradient(
          w * 0.5,
          h * 0.55,
          0,
          w * 0.5,
          h * 0.55,
          Math.max(w, h) * 0.8,
        );
        sky.addColorStop(0, '#1d3a32');
        sky.addColorStop(0.45, '#10241f');
        sky.addColorStop(1, '#050b0a');
        g.fillStyle = sky;
        g.fillRect(0, 0, w, h);
        for (let n = 0; n < 6; n++) {
          const x = rnd() * w,
            y = rnd() * h,
            r = 120 + rnd() * 260;
          const fog = g.createRadialGradient(x, y, 0, x, y, r);
          fog.addColorStop(0, 'rgba(110, 160, 130, 0.07)');
          fog.addColorStop(1, 'rgba(110, 160, 130, 0)');
          g.fillStyle = fog;
          g.fillRect(0, 0, w, h);
        }
        for (let n = 0; n < 160; n++) {
          g.fillStyle = `rgba(236, 227, 207, ${0.15 + rnd() * 0.5})`;
          g.beginPath();
          g.arc(rnd() * w, rnd() * h, rnd() * 1.2 + 0.2, 0, Math.PI * 2);
          g.fill();
        }
        const cx = w * 0.5,
          cy = h * 0.56,
          R = Math.max(w, h) * 0.46;
        g.strokeStyle = brass;
        g.globalAlpha = 0.22;
        [
          [R, 2],
          [R * 0.9, 1],
          [R * 0.62, 1.5],
          [R * 0.58, 0.8],
        ].forEach(([r, lw]) => {
          g.lineWidth = lw;
          g.beginPath();
          g.arc(cx, cy, r, 0, Math.PI * 2);
          g.stroke();
        });
        const signs = ['♈', '♉', '♊', '♋', '♌', '♍', '♎', '♏', '♐', '♑', '♒', '♓'];
        g.fillStyle = brass;
        g.textAlign = 'center';
        g.textBaseline = 'middle';
        g.font = `${Math.round(R * 0.07)}px Georgia, serif`;
        for (let k = 0; k < 12; k++) {
          const a = (k / 12) * Math.PI * 2 - Math.PI / 2;
          g.lineWidth = 1;
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * R * 0.62, cy + Math.sin(a) * R * 0.62);
          g.lineTo(cx + Math.cos(a) * R, cy + Math.sin(a) * R);
          g.stroke();
          const b = a + Math.PI / 12;
          g.fillText(signs[k] + '︎', cx + Math.cos(b) * R * 0.76, cy + Math.sin(b) * R * 0.76);
        }
        for (let k = 0; k < 72; k++) {
          const a = (k / 72) * Math.PI * 2;
          g.beginPath();
          g.moveTo(cx + Math.cos(a) * R * 0.9, cy + Math.sin(a) * R * 0.9);
          g.lineTo(
            cx + Math.cos(a) * R * (k % 6 ? 0.93 : 0.96),
            cy + Math.sin(a) * R * (k % 6 ? 0.93 : 0.96),
          );
          g.stroke();
        }
        g.globalAlpha = 0.16;
        g.fillStyle = '#020605';
        for (let k = 0; k < 5; k++) {
          const side = k % 2 ? 1 : -1;
          let x = side > 0 ? w + 20 : -20,
            y = h * (0.2 + rnd() * 0.7);
          const width = 26 + rnd() * 18;
          const pts = [];
          for (let s = 0; s < 40; s++) {
            x -= side * (w * 0.012);
            y += Math.sin(s / 5 + k) * 9;
            pts.push([x, y, width * (1 - s / 40)]);
          }
          g.beginPath();
          pts.forEach(([px, py, pw], n) =>
            n ? g.lineTo(px, py - pw / 2) : g.moveTo(px, py - pw / 2),
          );
          pts
            .slice()
            .reverse()
            .forEach(([px, py, pw]) => g.lineTo(px, py + pw / 2));
          g.closePath();
          g.fill();
        }
        g.globalAlpha = 1;
        const vig = g.createRadialGradient(cx, cy, R * 0.5, cx, cy, Math.max(w, h));
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.65)');
        g.fillStyle = vig;
        g.fillRect(0, 0, w, h);
      }
      window.addEventListener('resize', paintMat);

      const boot = () => {
        paintMat();
        render();
      };
      window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot();
    </script>
  </body>
</html>
