<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>Arkham Companion Table</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=IM+Fell+English:ital@0;1&family=Alegreya+Sans:wght@400;500;700&display=swap"
    />
    <style>
      /* Layout: one full-height table. The playmat's header row (encounter deck, discard, agenda, act,
   scenario) on top, the map in the middle, the investigators docked below (beside it on wide screens).
   Two looks share it: "frames" (our own card frames around the card art) and "cards" (full card faces). */
      :root {
        color-scheme: dark;
        --night: #0b1614;
        --brass: #c9a45c;
        --brass-dim: #8a7140;
        --bone: #ece3cf;
        --bone-dim: #b5ab95;
        --ink: #1b1408;
        --panel: rgba(14, 26, 23, 0.88);
        --panel-line: rgba(201, 164, 92, 0.32);
        --clue: #3f9bb5;
        --doom: #b8433f;
        --health: #c0504a;
        --sanity: #4f78c4;
        --resource: #b98a3c;
        --good: #6fb98a;
        --scrim: rgba(3, 8, 7, 0.78);
        --frame-location: #8c7a55;
        --frame-agenda: #9a4a3c;
        --frame-act: #4a6f9a;
        --frame-enemy: #8f3b36;
        --frame-treachery: #6e5a8c;
        --frame-scenario: #6e5a8c;
        --token-black: #121212;
        --token-ring: #e6dcc3;

        --font-display: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
        --font-story: 'IM Fell English', Georgia, serif;
        --font-ui: 'Alegreya Sans', 'Segoe UI', system-ui, sans-serif;

        --hc-h: clamp(60px, calc((100vw - 70px) / 4.85), 128px);
        --tile-w: clamp(116px, 33vw, 168px);
        --compact: 24px;
        --touch: 44px;
        --radius: 6px;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        background: var(--night);
        color: var(--bone);
        font-family: var(--font-ui);
        font-size: 15px;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
      }
      button:focus-visible {
        outline: 2px solid var(--brass);
        outline-offset: 2px;
      }

      #mat {
        position: fixed;
        inset: 0;
        z-index: 0;
        pointer-events: none;
      }
      #mat canvas {
        width: 100%;
        height: 100%;
        display: block;
      }

      #app {
        position: relative;
        z-index: 1;
        height: 100%;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
        grid-template-areas: 'head' 'status' 'map' 'dock';
      }
      @media (min-width: 900px) {
        #app {
          grid-template-columns: minmax(0, 1fr) 23rem;
          grid-template-rows: auto auto minmax(0, 1fr);
          grid-template-areas: 'head head' 'status status' 'map dock';
        }
      }

      /* ---------- Header: the playmat's top row ---------- */
      #head {
        grid-area: head;
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: clamp(5px, 1.6vw, 18px);
        padding-block: 10px 6px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        overflow-x: auto;
        scrollbar-width: none;
        background: linear-gradient(to bottom, rgba(5, 12, 10, 0.9), rgba(5, 12, 10, 0.35));
        border-bottom: 1px solid var(--panel-line);
      }
      #head::-webkit-scrollbar {
        display: none;
      }
      .slot {
        display: grid;
        gap: 3px;
        justify-items: center;
        flex: none;
      }
      .slot-label {
        font-family: var(--font-display);
        font-size: 9px;
        letter-spacing: 0.04em;
        color: var(--brass);
        text-transform: uppercase;
        white-space: nowrap;
        opacity: 0.85;
      }
      .slot-pair {
        display: flex;
        gap: 4px;
        align-items: flex-end;
      }
      .hcard {
        position: relative;
        height: var(--hc-h);
        border-radius: var(--radius);
        box-shadow:
          0 0 0 1px var(--brass-dim),
          0 6px 14px rgba(0, 0, 0, 0.55);
        overflow: hidden;
        background: #1a2a25;
      }
      .hcard.portrait {
        width: calc(var(--hc-h) * 5 / 7);
      }
      .hcard.landscape {
        width: calc(var(--hc-h) * 7 / 5);
      }
      .hcard.small {
        height: calc(var(--hc-h) * 0.6);
        width: calc(var(--hc-h) * 0.6 * 5 / 7);
      }
      .hcard > .hit {
        position: absolute;
        inset: 0;
        border: 0;
        padding: 0;
        background: none;
        cursor: zoom-in;
      }
      .plate {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 3px;
        padding: 3px 4px;
        background: linear-gradient(to top, rgba(6, 10, 9, 0.94), rgba(6, 10, 9, 0.6));
        font-size: 12px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }
      .plate .count {
        display: flex;
        align-items: center;
        gap: 3px;
        white-space: nowrap;
      }
      .plate .tok {
        min-width: 20px;
        height: 20px;
        font-size: 12px;
      }
      .plate .cbtn.go {
        font-size: 10px;
        padding: 0 3px;
      }
      .cbtn {
        min-width: var(--compact);
        height: var(--compact);
        border-radius: 4px;
        border: 1px solid var(--brass-dim);
        background: rgba(20, 34, 30, 0.95);
        font-weight: 700;
        font-size: 13px;
        padding: 0 6px;
        cursor: pointer;
      }
      .cbtn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .cbtn.go {
        background: var(--brass);
        color: var(--ink);
        border-color: var(--brass);
      }
      /* Steppers only show while the board is being adjusted. */
      .adj {
        display: none !important;
      }
      .editing .adj {
        display: inline-grid !important;
        place-items: center;
      }
      .deckback {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        background:
          radial-gradient(
            circle at 50% 45%,
            transparent 0 28%,
            var(--brass-dim) 28.5% 30%,
            transparent 30.5%
          ),
          radial-gradient(circle at 50% 45%, #1f3a30, #0b1714 70%);
      }
      .deckback span {
        font-family: var(--font-display);
        font-size: calc(var(--hc-h) * 0.26);
      }
      .pile-empty {
        position: absolute;
        inset: 0;
        border: 1px dashed var(--brass-dim);
        border-radius: var(--radius);
      }

      /* ---------- Card faces ---------- */
      /* "cards" look: the whole scanned card. */
      .face {
        position: absolute;
        inset: 0;
      }
      .face > img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        opacity: 0;
        transition: opacity 0.3s;
      }
      .face.loaded > img {
        opacity: 1;
      }
      .face .fb {
        position: absolute;
        inset: 0;
        display: grid;
        align-content: center;
        justify-items: center;
        text-align: center;
        padding: 4px;
        font-family: var(--font-display);
        font-size: 12px;
        line-height: 1.1;
        background:
          repeating-linear-gradient(-45deg, rgba(201, 164, 92, 0.16) 0 1px, transparent 1px 10px),
          #172621;
      }
      .face .fb small {
        font-family: var(--font-ui);
        font-size: 10px;
        color: var(--bone-dim);
      }
      .face.loaded .fb {
        display: none;
      }
      /* "frames" look: our own frame, the card's art cropped into it, our own name band. */
      .frame {
        position: absolute;
        inset: 0;
        display: grid;
        background: #0f1a17;
        border: 3px solid var(--fc, var(--brass-dim));
        border-radius: inherit;
        overflow: hidden;
      }
      .frame.t-location {
        --fc: var(--frame-location);
      }
      .frame.t-agenda {
        --fc: var(--frame-agenda);
      }
      .frame.t-act {
        --fc: var(--frame-act);
      }
      .frame.t-enemy {
        --fc: var(--frame-enemy);
      }
      .frame.t-treachery {
        --fc: var(--frame-treachery);
      }
      .frame.t-scenario {
        --fc: var(--frame-scenario);
      }
      .frame.t-investigator {
        --fc: var(--brass);
      }
      .art {
        background-color: #172621;
        background-repeat: no-repeat;
        background-image: repeating-linear-gradient(
          -45deg,
          rgba(201, 164, 92, 0.16) 0 1px,
          transparent 1px 10px
        );
      }
      .art.has-img {
        background-color: #000;
      }
      .band {
        display: grid;
        align-content: center;
        text-align: center;
        padding: 2px 4px;
        line-height: 1.05;
        background: linear-gradient(
          to bottom,
          color-mix(in srgb, var(--fc) 70%, #000),
          color-mix(in srgb, var(--fc) 40%, #000)
        );
        font-family: var(--font-display);
        font-size: 12px;
        color: var(--bone);
        min-width: 0;
        overflow: hidden;
      }
      .band small {
        font-family: var(--font-ui);
        font-size: 9px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--bone-dim);
      }
      .frame.portrait {
        grid-template-rows: auto minmax(0, 1fr) 30%;
      }
      .frame.portrait .art {
        background-size: 106% auto;
        background-position: 50% 16%;
      }
      .frame.portrait .foot {
        background: linear-gradient(#141d1a, #0b1311);
        border-top: 1px solid var(--fc);
      }
      .frame.t-location.back .art,
      .frame.t-location.portrait .art {
        background-size: 108% auto;
        background-position: 50% 14%;
      }
      .frame.t-enemy .art,
      .frame.t-treachery .art {
        background-size: 112% auto;
        background-position: 50% 13%;
      }
      .frame.landscape {
        grid-template-columns: 50% minmax(0, 1fr);
      }
      .frame.landscape .art {
        background-size: auto 112%;
        background-position: 6% 40%;
      }
      .frame.t-act.landscape {
        grid-template-columns: minmax(0, 1fr) 50%;
      }
      .frame.t-act.landscape .art {
        order: 2;
        background-position: 94% 40%;
      }
      .frame.landscape .band {
        align-content: start;
        padding-top: 6px;
        background: linear-gradient(color-mix(in srgb, var(--fc) 55%, #000), #0b1311);
      }
      .frame.small-text .band {
        font-size: 10px;
      }
      .frame.small-text .band small {
        display: none;
      }
      .mini .frame .band,
      .attach .frame .band {
        font-size: 0;
        min-height: 5px;
        padding: 0;
      }
      .mini .frame,
      .attach .frame {
        border-width: 2px;
      }
      .frame .stub {
        padding: 6px;
        font-size: 11px;
        color: var(--bone-dim);
        line-height: 1.3;
      }

      /* ---------- Status row ---------- */
      #status {
        grid-area: status;
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding-block: 6px;
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
      }
      .round {
        font-family: var(--font-display);
        font-size: 17px;
        white-space: nowrap;
        display: grid;
        line-height: 1.05;
        margin-right: auto;
      }
      .round small {
        font-family: var(--font-ui);
        font-size: 12px;
        color: var(--brass);
        letter-spacing: 0.04em;
      }
      .phases {
        display: flex;
        gap: 3px;
        flex: 1;
        min-width: 0;
        max-width: 16rem;
      }
      .phases span {
        flex: none;
        width: 14px;
        color: transparent;
        text-align: center;
        font-size: 11px;
        padding: 3px 2px;
        border-bottom: 2px solid rgba(201, 164, 92, 0.25);
        white-space: nowrap;
        overflow: hidden;
      }
      .phases span.on {
        flex: 1;
        width: auto;
        color: var(--bone);
        border-bottom-color: var(--brass);
        font-weight: 700;
      }
      @media (min-width: 601px) {
        .round small {
          display: none;
        }
      }
      .btn {
        min-height: 36px;
        padding: 0 14px;
        border-radius: 18px;
        border: 1px solid var(--brass-dim);
        background: rgba(16, 30, 26, 0.9);
        cursor: pointer;
        font-weight: 500;
      }
      .btn.primary {
        background: var(--brass);
        color: var(--ink);
        border-color: var(--brass);
        font-weight: 700;
      }
      .btn.on {
        background: var(--bone);
        color: var(--ink);
        border-color: var(--bone);
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .iconbtn {
        width: 36px;
        padding: 0;
        display: grid;
        place-items: center;
      }
      .iconbtn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      #editbar {
        grid-column: 1 / -1;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 10px;
        background: var(--bone);
        color: var(--ink);
        width: 100%;
      }
      #editbar span {
        flex: 1;
        font-weight: 700;
        font-size: 14px;
      }
      #editbar .btn {
        min-height: 32px;
        background: transparent;
        border-color: var(--ink);
      }
      #editbar .btn.primary {
        background: var(--ink);
        color: var(--bone);
      }

      /* ---------- Map ---------- */
      #mapwrap {
        grid-area: map;
        overflow: auto;
        position: relative;
      }
      #map {
        position: relative;
        margin: 0 auto;
        width: max-content;
        display: grid;
        grid-template-columns: repeat(2, var(--tile-w));
        column-gap: clamp(44px, 12vw, 96px);
        row-gap: 34px;
        padding: 18px 22px 28px;
      }
      #lines {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        overflow: visible;
      }
      #lines line {
        stroke: var(--brass);
        stroke-width: 3;
        stroke-dasharray: 2 7;
        stroke-linecap: round;
        opacity: 0.7;
      }
      .loc {
        position: relative;
        width: var(--tile-w);
        aspect-ratio: 5 / 7;
        max-width: 100%;
        border-radius: 8px;
        box-shadow:
          0 0 0 1.5px var(--brass-dim),
          0 10px 22px rgba(0, 0, 0, 0.6);
        background: #172621;
        transition: box-shadow 0.2s;
      }
      .loc .faceclip {
        position: absolute;
        inset: 0;
        border-radius: 8px;
        overflow: hidden;
      }
      .loc > .hit {
        position: absolute;
        inset: 0;
        border: 0;
        background: none;
        padding: 0;
        cursor: zoom-in;
        border-radius: 8px;
      }
      .loc.target {
        box-shadow:
          0 0 0 3px var(--good),
          0 0 22px rgba(111, 185, 138, 0.55);
      }
      .loc.target > .hit {
        cursor: pointer;
      }
      .loc.blocked::after {
        content: 'Blocked';
        position: absolute;
        left: 50%;
        top: 30%;
        transform: translate(-50%, -50%) rotate(-12deg);
        font-family: var(--font-display);
        font-size: 15px;
        padding: 2px 8px;
        border: 2px solid var(--doom);
        color: #f0c9c5;
        background: rgba(30, 6, 6, 0.75);
        pointer-events: none;
      }
      .pencil {
        position: absolute;
        top: 4px;
        right: 4px;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        z-index: 4;
        border: 1px solid var(--ink);
        background: var(--bone);
        color: var(--ink);
        place-items: center;
        cursor: pointer;
      }
      .pencil svg {
        width: 15px;
        height: 15px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
      }
      /* Shroud on the left and clues on the right at mid height, where the printed card has them. */
      .midline {
        position: absolute;
        left: -9px;
        right: -9px;
        top: 50%;
        transform: translateY(-50%);
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 3;
        pointer-events: none;
      }
      .midline .side {
        display: grid;
        gap: 3px;
        justify-items: center;
      }
      .tok {
        min-width: 26px;
        height: 26px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        font-size: 14px;
        font-weight: 700;
        color: #fff;
        box-shadow:
          0 2px 5px rgba(0, 0, 0, 0.7),
          inset 0 0 0 2px rgba(255, 255, 255, 0.25);
        padding: 0 4px;
      }
      .tok.clue {
        background: var(--clue);
      }
      .tok.doom {
        background: var(--doom);
      }
      .tok.shroud {
        background: #2c2c33;
        border: 2px solid var(--bone-dim);
        border-radius: 50% 50% 45% 45%;
      }
      .tok.shroud.up {
        border-color: #c68df0;
      }
      .tok.empty {
        background: rgba(63, 155, 181, 0.25);
        color: rgba(255, 255, 255, 0.6);
      }
      .attach {
        position: absolute;
        right: -12px;
        top: 9%;
        width: 28%;
        aspect-ratio: 5 / 7;
        border-radius: 4px;
        overflow: hidden;
        z-index: 3;
        transform: rotate(8deg);
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.7);
        border: 0;
        padding: 0;
        cursor: zoom-in;
        background: #222;
      }
      .pawns {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 6px;
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 4px;
        padding: 0 4px;
        z-index: 4;
        pointer-events: none;
      }
      .pawn {
        pointer-events: auto;
        position: relative;
        width: calc(var(--tile-w) * 0.3);
        aspect-ratio: 1;
        border-radius: 50%;
        flex: none;
        border: 3px solid var(--brass);
        background-color: #22332d;
        background-size: cover;
        cursor: pointer;
        padding: 0;
        box-shadow: 0 3px 8px rgba(0, 0, 0, 0.7);
        touch-action: none;
      }
      .pawn.enemy {
        border-color: var(--doom);
      }
      .pawn.enemy.exhausted {
        transform: rotate(90deg);
        filter: saturate(0.4) brightness(0.7);
      }
      .pawn.active {
        box-shadow:
          0 0 0 3px rgba(201, 164, 92, 0.45),
          0 0 16px rgba(201, 164, 92, 0.8);
        cursor: grab;
      }
      .pawn .ini {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-family: var(--font-display);
        font-size: 14px;
      }
      .pawn.has-img .ini {
        display: none;
      }
      .pawn .hp {
        position: absolute;
        right: -5px;
        bottom: -5px;
        min-width: 17px;
        height: 17px;
        border-radius: 9px;
        font-size: 10px;
        font-weight: 700;
        background: var(--doom);
        color: #fff;
        display: grid;
        place-items: center;
        padding: 0 3px;
      }
      .ghost {
        position: fixed;
        z-index: 50;
        pointer-events: none;
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.1);
      }
      #movehint {
        z-index: 5;
        margin: 0 auto;
        width: fit-content;
        padding: 6px 14px;
        border-radius: 16px;
        background: var(--good);
        color: #0b1a12;
        font-weight: 700;
        display: flex;
        gap: 10px;
        align-items: center;
      }
      #movehint button {
        border: 0;
        background: rgba(0, 0, 0, 0.15);
        border-radius: 10px;
        padding: 2px 8px;
        cursor: pointer;
      }

      /* ---------- Investigator dock ---------- */
      #dock {
        grid-area: dock;
        display: flex;
        overflow-x: auto;
        scroll-snap-type: x mandatory;
        gap: 10px;
        padding-block: 8px calc(8px + env(safe-area-inset-bottom, 0px));
        padding-left: max(16px, env(safe-area-inset-left, 0px));
        padding-right: max(16px, env(safe-area-inset-right, 0px));
        background: linear-gradient(to top, rgba(5, 12, 10, 0.96), rgba(5, 12, 10, 0.72));
        border-top: 1px solid var(--panel-line);
        scrollbar-width: none;
      }
      #dock::-webkit-scrollbar {
        display: none;
      }
      @media (min-width: 900px) {
        #dock {
          flex-direction: column;
          overflow-y: auto;
          overflow-x: hidden;
          scroll-snap-type: none;
          border-top: 0;
          border-left: 1px solid var(--panel-line);
          padding-block: 12px;
        }
      }
      .inv {
        flex: none;
        width: calc(100% - 22px);
        scroll-snap-align: center;
        display: grid;
        gap: 8px;
        padding: 10px;
        border-radius: 10px;
        background: var(--panel);
        border: 1px solid var(--panel-line);
        align-content: start;
      }
      @media (min-width: 900px) {
        .inv {
          width: auto;
        }
      }
      .inv.turn {
        border-color: var(--brass);
        box-shadow: 0 0 18px rgba(201, 164, 92, 0.18);
      }
      .inv.defeated {

      @media (max-width: 600px) {

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;

  <body>
    <div id="mat"><canvas id="matcanvas" aria-hidden="true"></canvas></div>

    <div id="toasts" aria-live="polite"></div>

    <script>
      'use strict';
      /* ================= Card data (hand-entered stats, The Gathering) ================= */
      const C = {

        '01105': { name: "What's Going On?!", type: 'agenda', stage: 1, doom: 3, back: true },

        },
        '01162': {

        },
        '01163': {

        },
        '01164': {
          name: 'Frozen in Fear',

          threat: true,
          text: 'Threat area. Your first move, fight or evade action each round costs 1 more action. End of turn: test willpower (3) to discard it.',
        },
        '01165': {

        },
        '01166': {
          name: 'Ancient Evils',

          doom: 1,

        },
        '01167': {
          name: 'Crypt Chill',
          type: 'treachery',
          test: ['willpower', 4],
          byHand: 'Discard an asset you control, or take 2 damage if you cannot.',
          text: 'Test willpower (4). If you fail, discard an asset or take 2 damage.',
        },
        '01168': {
          name: 'Obscuring Fog',
          type: 'treachery',
          attach: '+2 shroud',
          text: 'Attach to your location: +2 shroud. Discard it after a successful investigation there.',
        },
        '01001': { name: 'Roland Banks', type: 'investigator', back: true },
        '01005': { name: 'Wendy Adams', type: 'investigator', back: true },
      };
      const ENCOUNTER = [
        '01159',
        '01160',
        '01161',
        '01162',
        '01163',
        '01164',
        '01165',
        '01166',
        '01167',
        '01168',
        '01118',
        '01119',
      ];
      const LANDSCAPE = new Set(['agenda', 'act', 'investigator']);
      const CONNECT = [
        ['hallway', 'attic'],
        ['hallway', 'cellar'],
        ['hallway', 'parlor'],
      ];
      const GRID = { attic: [1, 1], hallway: [1, 2], cellar: [1, 3], parlor: [2, 2] };
      const PHASES = ['mythos', 'investigation', 'enemy', 'upkeep'];
      const PHASE_NAME = {
        mythos: 'Mythos',
        investigation: 'Investigation',
        enemy: 'Enemy',
        upkeep: 'Upkeep',
      };
      /* Standard difficulty bag of The Gathering. */
      const BAG = [
        '+1',
        '0',
        '0',
        '-1',
        '-1',
        '-1',
        '-2',
        '-2',
        '-3',
        '-4',
        'skull',
        'skull',
        'cultist',
        'tablet',
        'fail',
        'elder',
      ];

      /* ================= Look: frames (own frame + card art) or full card faces ================= */
      let look = 'frames';
      try {
        look = localStorage.getItem('look') || 'frames';
      } catch (e) {
        console.warn('No stored look', e);
      }

      /* ================= Card pictures: fetched from ArkhamDB on the device, never bundled ================= */
      const imgCache = new Map();
      function resolveImage(code, back) {
        const key = code + (back ? 'b' : '');
        if (!imgCache.has(key)) {
          imgCache.set(
            key,
            new Promise((resolve) => {
              const base = `https://arkhamdb.com/bundles/cards/${key}`;
              const urls = [base + '.png', base + '.jpg'];
              const tryNext = (i) => {
                if (i >= urls.length) {
                  resolve(null);
                  return;
                }
                const img = new Image();
                img.onload = () => resolve(urls[i]);
                img.onerror = () => tryNext(i + 1);
                img.src = urls[i];
              };
              tryNext(0);
            }),
          );
        }
        return imgCache.get(key);
      }
      function hydrateImages(root) {
        root.querySelectorAll('[data-img]').forEach((el) => {
          const [code, side] = el.dataset.img.split(':');
          resolveImage(code, side === 'b').then((url) => {
            if (!url) return;
            if (el.classList.contains('face')) {
              const img = el.querySelector('img');
              if (img.getAttribute('src') !== url) img.src = url;
              el.classList.add('loaded');
            } else {
              el.style.backgroundImage = `url("${url}")`;
              el.classList.add('has-img');
            }
          });
        });
      }
      /* One card side in the current look. `opts.text` adds our short rules line under the art (frames look, big cards). */
      function face(code, back, opts = {}) {
        const c = C[code];
        const shape = LANDSCAPE.has(c.type) ? 'landscape' : 'portrait';
        if (look === 'cards') {
          const sub = back && c.type === 'location' ? 'Unrevealed' : back ? 'Back' : c.type;
          return `<div class="face" data-img="${code}:${back ? 'b' : 'f'}"><img alt="${esc(c.name)}${back ? ' (back)' : ''}">
      <div class="fb">${esc(c.name)}<small>${esc(sub)}</small></div></div>`;
        }
        const sub =
          c.type === 'location'
            ? back
              ? 'Unrevealed'
              : 'Location'
            : c.stage
              ? `${c.type} ${c.stage}${back ? ' · back' : ''}`
              : c.type;
        const art =
          c.type === 'scenario'
            ? '<div class="art"></div>'
            : `<div class="art" data-img="${code}:${back ? 'b' : 'f'}" role="img" aria-label="${esc(c.name)}"></div>`;
        const band = `<div class="band">${esc(c.name)}<small>${esc(sub)}</small></div>`;
        if (shape === 'landscape')
          return `<div class="frame landscape t-${c.type} ${opts.small ? 'small-text' : ''}">${art}${band}</div>`;
        return `<div class="frame portrait t-${c.type} ${back ? 'back' : ''} ${opts.small ? 'small-text' : ''}">${band}${art}<div class="foot">${opts.text && c.text ? `<p class="stub">${esc(c.text)}</p>` : ''}</div></div>`;
      }
      /* Avatar tokens crop the card's art: investigators from their landscape card, enemies from the top of theirs. */
      function pawnHtml(kind, code, attrs = '', cls = '', badge = '') {
        const c = C[code];
        const pos =
          kind === 'inv'
            ? 'background-size: 330%; background-position: 4% 42%;'
            : 'background-size: 210%; background-position: 50% 24%;';
        const initials = c.name
          .split(' ')
          .map((w) => w[0])
          .join('')
          .slice(0, 2);
        return `<button type="button" class="pawn ${kind === 'enemy' ? 'enemy' : ''} ${cls}" style="${pos}" data-img="${code}:f" aria-label="${esc(c.name)}" ${attrs}><span class="ini">${initials}</span>${badge}</button>`;
      }
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[ch],
        );
      }

      /* ================= Chaos tokens: dark discs with an ivory rim, like the printed ones; own glyphs ================= */
      function tokenSvg(tok, cls = '') {
        const glyph = {
          skull:

          fail: '<path fill="none" stroke="#e0473f" stroke-width="9" stroke-linecap="round" d="M30 78c2-18 20-16 26-28s-2-22-11-19c-7 2-5 12 2 11"/><path fill="none" stroke="#e0473f" stroke-width="4" stroke-linecap="round" d="M62 78c-2-8 6-12 10-18"/>',
        }[tok];
        const inner = {
          skull: '#5a1d18',
          cultist: '#1f3a25',
          tablet: '#1d3352',
          elder: '#0f4646',
          fail: '#1a0707',
        }[tok];
        const label =
          {
            skull: 'Skull',
            cultist: 'Cultist',
            tablet: 'Tablet',
            elder: 'Elder Sign',
            fail: 'Auto-fail',
          }[tok] || tok.replace('-', '−');
        const body =
          glyph ||
          `<text x="50" y="52" text-anchor="middle" dominant-baseline="central" font-family="Georgia, serif" font-weight="700" font-size="${tok.length > 1 ? 34 : 40}" fill="#f4eedf">${label}</text>`;
        return `<svg viewBox="0 0 100 100" class="${cls}" role="img" aria-label="${label} token">
    <defs><radialGradient id="tg${tok}" cx="38%" cy="32%" r="75%"><stop offset="0" stop-color="#3a3a3a"/><stop offset="1" stop-color="#050505"/></radialGradient></defs>
    <circle cx="50" cy="50" r="48" fill="var(--token-ring)"/><circle cx="50" cy="50" r="44" fill="url(#tg${tok})"/>
    ${inner ? `<circle cx="50" cy="50" r="37" fill="${inner}" opacity="0.85"/>` : ''}
    <circle cx="50" cy="50" r="40" fill="none" stroke="#8d7a55" stroke-width="1.2" stroke-dasharray="1.5 3"/>${body}</svg>`;
      }

      /* ================= Game state ================= */
      let uid = 10;
      function initialState() {
        return {
          round: 2,
          phase: 'investigation',
          turn: 0,
          investigators: [
            {
              id: 'roland',
              code: '01001',
              name: 'Roland Banks',
              cls: 'Guardian',
              skills: { willpower: 3, intellect: 3, combat: 4, agility: 2 },
              health: 9,
              sanity: 5,
              damage: 0,
              horror: 1,
              clues: 1,
              resources: 5,
              actions: 3,
              loc: 'hallway',
              elder: 1,
              done: false,
              threat: ['01164'],
              defeated: false,
            },
            {
              id: 'wendy',
              code: '01005',
              name: 'Wendy Adams',
              cls: 'Survivor',
              skills: { willpower: 4, intellect: 3, combat: 1, agility: 4 },
              health: 7,
              sanity: 7,
              damage: 1,
              horror: 0,
              clues: 2,
              resources: 3,

              loc: 'attic',
              elder: 0,
              done: false,
              threat: ['01165'],
              defeated: false,
            },
          ],
          locations: {
            attic: { code: '01113', revealed: true, clues: 3, doom: 0, attach: ['01168'] },
            hallway: { code: '01112', revealed: true, clues: 0, doom: 0, attach: [] },
            cellar: { code: '01114', revealed: false, clues: 0, doom: 0, attach: [] },
            parlor: {
              code: '01115',
              revealed: false,
              clues: 0,
              doom: 0,

            },
          },
          enemies: [
            {
              uid: 'e1',

              loc: 'attic',
              engaged: 'wendy',
              damage: 1,
              exhausted: false,
            },
          ],
          agenda: { code: '01106', doom: 2 },
          act: { code: '01109', clues: 2 },
          deck: shuffle([
            '01159',
            '01159',
            '01160',
            '01160',
            '01160',
            '01161',
            '01162',
            '01163',
            '01163',
            '01164',
            '01165',
            '01166',
            '01167',
            '01167',
            '01168',
            '01119',
          ]),
          discard: ['01162'],
          victory: [],
          log: [
            { r: 1, t: 'Setup: Study in play, Roland and Wendy start there.' },
            {
              r: 1,
              t: 'Act 1 advanced: the Study is gone. Hallway, Attic, Cellar and Parlor put into play.',
            },
            { r: 2, t: 'Mythos: 1 doom on Rise of the Ghouls.' },
            {
              r: 2,
              t: 'Roland drew Frozen in Fear; Wendy drew Flesh-Eater, which spawned in the Attic.',
            },
          ],
        };
      }
      function shuffle(a) {
        const b = a.slice();
        for (let i = b.length - 1; i > 0; i--) {
          const j = Math.floor(Math.random() * (i + 1));
          [b[i], b[j]] = [b[j], b[i]];
        }
        return b;
      }

      let S = initialState();
      const undoStack = [];
      const ui = { moving: null, sheet: null, edit: null };

      /* Every play step is one undo step. While adjusting, changes collect into one step that Done keeps. */
      function step(label, fn) {
        if (ui.edit) {
          fn();
          if (label) ui.edit.changes.push(label);
          render();
          return;
        }
        undoStack.push(JSON.stringify(S));
        if (undoStack.length > 60) undoStack.shift();
        fn();
        if (label) log(label);
        render();
      }
      function undo() {
        if (!undoStack.length) return;
        S = JSON.parse(undoStack.pop());
        closeSheet();
        toast('Undone');
        render();
      }
      function startEdit() {
        ui.edit = { snapshot: JSON.stringify(S), changes: [] };
        ui.moving = null;
        render();
      }
      function finishEdit(keep) {
        const { snapshot, changes } = ui.edit;
        ui.edit = null;
        if (!keep) {
          S = JSON.parse(snapshot);
          toast('Adjustments dropped');
        } else if (changes.length) {
          undoStack.push(snapshot);
          log(`Board adjusted: ${changes.length} change${changes.length > 1 ? 's' : ''}.`);
          toast('Adjustments kept as one undo step');
        }
        closeSheet();
        render();
      }
      function log(t) {
        S.log.push({ r: S.round, t });
      }

      const players = () => S.investigators.length;
      const inv = (id) => S.investigators.find((i) => i.id === id);
      const turnInv = () =>
        S.phase === 'investigation' && !ui.edit ? S.investigators[S.turn] : null;
      const enemiesAt = (loc) => S.enemies.filter((e) => e.loc === loc);
      const connected = (a, b) =>
        CONNECT.some(([x, y]) => (x === a && y === b) || (x === b && y === a));
      const shroud = (loc) =>
        C[S.locations[loc].code].shroud + (S.locations[loc].attach.includes('01168') ? 2 : 0);
      const totalDoom = () =>
        S.agenda.doom + Object.values(S.locations).reduce((n, l) => n + l.doom, 0);
      const actNeed = () => (C[S.act.code].clues == null ? null : C[S.act.code].clues * players());

      /* ================= Rendering ================= */
      const ICON = {
        pencil:
          '<svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',
        undo: '<svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
        menu: '<svg viewBox="0 0 24 24"><path d="M5 6h14M5 12h14M5 18h14"/></svg>',
        x: '<svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>',
        health:
          '<svg viewBox="0 0 24 24"><path fill="var(--health)" d="M12 21s-7.5-4.6-9.6-9.2A5.3 5.3 0 0 1 12 6.3a5.3 5.3 0 0 1 9.6 5.5C19.5 16.4 12 21 12 21z"/></svg>',
        sanity:
          '<svg viewBox="0 0 24 24"><path fill="var(--sanity)" d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3.2" fill="#0b1614"/></svg>',
        clue: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--clue)"/></svg>',
        res: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="var(--resource)"/><circle cx="12" cy="12" r="5" fill="none" stroke="#3b2a10" stroke-width="2"/></svg>',
      };

      function render() {
        document.body.classList.toggle('editing', !!ui.edit);
        renderHead();
        renderStatus();
        renderMap();
        renderDock();
        if (ui.sheet) ui.sheet();
        hydrateImages(document.body);
      }

      function renderHead() {
        const ag = C[S.agenda.code],
          ac = C[S.act.code];
        const need = actNeed();
        const top = S.discard[S.discard.length - 1];
        document.getElementById('head').innerHTML = `
    <div class="slot"><span class="slot-label">Encounter</span>
      <div class="slot-pair">
        <div class="hcard portrait"><div class="deckback"><span>${S.deck.length}</span></div>
          <button class="hit" data-act="deck" aria-label="Encounter deck, ${S.deck.length} cards"></button></div>
        <div class="hcard small">${top ? face(top, false, { small: true }) : '<div class="pile-empty"></div>'}
          <button class="hit" data-act="discard" aria-label="Encounter discard pile"></button></div>
      </div></div>
    <div class="slot"><span class="slot-label">Agenda ${ag.stage}</span>
      <div class="hcard landscape">${face(S.agenda.code, false, { small: true })}
        <button class="hit" data-zoom="agenda" aria-label="Agenda: ${esc(ag.name)}"></button>
        <div class="plate"><button class="cbtn adj" data-act="doom-" aria-label="Remove doom">−</button>
          <span class="count"><span class="tok doom">${S.agenda.doom}</span>/ ${ag.doom}</span>
          <button class="cbtn adj" data-act="doom+" aria-label="Add doom">+</button></div></div></div>
    <div class="slot"><span class="slot-label">Act ${ac.stage}</span>
      <div class="hcard landscape">${face(S.act.code, false, { small: true })}
        <button class="hit" data-zoom="act" aria-label="Act: ${esc(ac.name)}"></button>
        <div class="plate"><button class="cbtn adj" data-act="actclue-" aria-label="Remove a clue from the act">−</button>
          <span class="count"><span class="tok clue">${S.act.clues}</span>${need == null ? '' : '/ ' + need}</span>
          <button class="cbtn adj" data-act="actclue+" aria-label="Add a clue to the act">+</button>
          ${ui.edit ? '' : `<button class="cbtn go" data-act="advance-act" ${need != null && S.act.clues >= need ? '' : 'disabled'}>Advance</button>`}</div></div></div>
    <div class="slot"><span class="slot-label">Scenario</span>
      <div class="hcard portrait">${face('01104', false, { small: true })}
        <button class="hit" data-zoom="scenario" aria-label="Scenario reference card"></button></div></div>`;
      }

      function renderStatus() {
        const el = document.getElementById('status');
        if (ui.edit) {
          el.innerHTML = `<div id="editbar"><span>Adjusting the board${ui.edit.changes.length ? ` · ${ui.edit.changes.length} change${ui.edit.changes.length > 1 ? 's' : ''}` : ''}</span>
      <button class="btn" data-act="edit-cancel">Cancel</button><button class="btn primary" data-act="edit-done">Done</button></div>`;
          return;
        }
        const canNext =
          S.phase !== 'investigation' || S.investigators.every((i) => i.done || i.defeated);
        el.innerHTML = `
    <span class="round">Round ${S.round}<small>${PHASE_NAME[S.phase]} phase</small></span>
    <div class="phases" role="list" aria-label="Phase">${PHASES.map((p) => `<span role="listitem" class="${p === S.phase ? 'on' : ''}">${PHASE_NAME[p]}</span>`).join('')}</div>
    <button class="btn primary" data-act="next" ${canNext ? '' : 'disabled'}>${{ mythos: 'Investigate', investigation: 'Enemy phase', enemy: 'Upkeep', upkeep: 'Next round' }[S.phase]}</button>
    <button class="btn iconbtn" data-act="edit" aria-label="Adjust the board">${ICON.pencil}</button>
    <button class="btn iconbtn" data-act="undo" aria-label="Undo" ${undoStack.length ? '' : 'disabled'}>${ICON.undo}</button>
    <button class="btn iconbtn" data-act="menu" aria-label="Menu">${ICON.menu}</button>`;
      }

      function renderMap() {
        const map = document.getElementById('map');
        const moving = ui.moving ? inv(ui.moving) : null;
        let html = '<svg id="lines" aria-hidden="true"></svg>';
        if (moving)
          html += `<div id="movehint" style="grid-column: 1 / -1">Move ${esc(moving.name.split(' ')[0])}: tap a lit location <button data-act="cancel-move">Cancel</button></div>`;
        for (const [key, l] of Object.entries(S.locations)) {
          const c = C[l.code];
          const [col, row] = GRID[key];
          const target = moving && connected(moving.loc, key) && !l.blocked;
          const pawns =
            S.investigators
              .filter((i) => i.loc === key && !i.defeated)
              .map((i) => {
                const active = turnInv() && turnInv().id === i.id && i.actions > 0;
                return pawnHtml('inv', i.code, `data-pawn="${i.id}"`, active ? 'active' : '');
              })
              .join('') +
            enemiesAt(key)
              .map((e) => {
                const left = C[e.code].health * (C[e.code].elite ? players() / 2 : 1) - e.damage;
                return pawnHtml(
                  'enemy',
                  e.code,
                  `data-enemy="${e.uid}"`,
                  e.exhausted ? 'exhausted' : '',
                  `<span class="hp">${left}</span>`,
                );
              })
              .join('');
          const sh = shroud(key);
          html += `<div class="loc ${target ? 'target' : ''} ${l.blocked ? 'blocked' : ''}" data-loc="${key}" style="grid-column:${col};grid-row:${row + (moving ? 1 : 0)}">
      <div class="faceclip">${face(l.code, !l.revealed)}</div>
      <button class="hit" data-loc-hit="${key}" aria-label="${esc(c.name)}"></button>
      ${
        l.revealed
          ? `<div class="midline"><div class="side"><span class="tok shroud ${sh > c.shroud ? 'up' : ''}" title="Shroud">${sh}</span></div>
        <div class="side"><span class="tok clue ${l.clues ? '' : 'empty'}" title="Clues">${l.clues}</span>${l.doom ? `<span class="tok doom" title="Doom">${l.doom}</span>` : ''}</div></div>`
          : ''
      }
      ${l.attach.map((a) => `<button class="attach" data-card="${a}" aria-label="${esc(C[a].name)} attached">${face(a, false, { small: true })}</button>`).join('')}
      <button class="pencil adj" data-edit="${key}" aria-label="Adjust ${esc(c.name)}">${ICON.pencil}</button>
      <div class="pawns">${pawns}</div></div>`;
        }
        map.innerHTML = html;
        requestAnimationFrame(drawLines);
      }
      function drawLines() {
        const svg = document.getElementById('lines');
        if (!svg) return;
        const box = (k) => {
          const el = document.querySelector(`[data-loc="${k}"]`);
          return (
            el && { x: el.offsetLeft + el.offsetWidth / 2, y: el.offsetTop + el.offsetHeight / 2 }
          );
        };
        svg.innerHTML = CONNECT.map(([a, b]) => {
          const p = box(a),
            q = box(b);
          return p && q ? `<line x1="${p.x}" y1="${p.y}" x2="${q.x}" y2="${q.y}"/>` : '';
        }).join('');
      }

      function renderDock() {
        const ti = turnInv();
        document.getElementById('dock').innerHTML = S.investigators
          .map((i) => {
            const isTurn = ti && ti.id === i.id;
            const engaged = S.enemies.filter((e) => e.engaged === i.id);
            const here = enemiesAt(i.loc);
            const can = isTurn && i.actions > 0 && !i.defeated;
            const where = C[S.locations[i.loc].code].name;
            const status = i.defeated
              ? 'Defeated'
              : isTurn
                ? `Turn · ${where}`
                : i.done
                  ? `Turn done · ${where}`
                  : where;
            return `<section class="inv ${isTurn ? 'turn' : ''} ${i.defeated ? 'defeated' : ''}" aria-label="${esc(i.name)}">
      <div class="inv-head">${pawnHtml('inv', i.code, `data-zoom-inv="${i.id}"`)}
        <div><div class="inv-name">${esc(i.name)}</div><div class="inv-sub">${esc(status)}</div></div>
        ${isTurn ? `<div class="pips" aria-label="${i.actions} actions left">${[0, 1, 2].map((n) => `<i class="${n < i.actions ? 'on' : ''}"></i>`).join('')}</div>` : '<span></span>'}</div>
      <div class="stats">
        ${stat(i, 'health', 'Health', i.health - i.damage, i.health, 'damage')}
        ${stat(i, 'sanity', 'Sanity', i.sanity - i.horror, i.sanity, 'horror')}
        ${stat(i, 'clue', 'Clues', i.clues, null, 'clues')}
        ${stat(i, 'res', 'Res.', i.resources, null, 'resources')}
      </div>
      ${
        engaged.length || i.threat.length
          ? `<span class="zone-label">Threat area</span><div class="threat">
        ${engaged.map((e) => `<span class="threat-item">${pawnHtml('enemy', e.code, `data-enemy="${e.uid}"`, e.exhausted ? 'exhausted' : '')}${esc(C[e.code].name)}</span>`).join('')}
        ${i.threat.map((t) => `<span class="threat-item"><button class="mini" data-card="${t}" aria-label="${esc(C[t].name)}">${face(t, false, { small: true })}</button>${esc(C[t].name)}</span>`).join('')}</div>`
          : ''
      }
      ${
        i.defeated
          ? ''
          : isTurn
            ? `<div class="acts">
        <button class="btn" data-do="investigate" data-inv="${i.id}" ${can && S.locations[i.loc].clues ? '' : 'disabled'}>Investigate</button>
        <button class="btn" data-do="move" data-inv="${i.id}" ${can ? '' : 'disabled'}>Move</button>
        <button class="btn" data-do="fight" data-inv="${i.id}" ${can && here.length ? '' : 'disabled'}>Fight</button>
        <button class="btn" data-do="evade" data-inv="${i.id}" ${can && engaged.length ? '' : 'disabled'}>Evade</button>
        <button class="btn end" data-do="end" data-inv="${i.id}">End turn</button></div>`
            : `<p class="waiting">${ui.edit ? 'Adjusting: change any counter, then Done.' : S.phase === 'investigation' ? (i.done ? 'Waiting for the round to end.' : 'Up after the current investigator.') : `${PHASE_NAME[S.phase]} phase: the app handles the encounter side.`}</p>`
      }
    </section>`;
          })
          .join('');
      }
      function stat(i, icon, label, value, max, field) {
        /* Health and sanity show what is left; the steppers change damage and horror, like the tokens on the card. */
        const down = field === 'damage' || field === 'horror' ? '+' : '-';
        const up = down === '+' ? '-' : '+';
        return `<div class="stat"><span class="lbl">${ICON[icon]}${label}</span>
    <span class="val">${value}${max ? `<small>/${max}</small>` : ''}</span>
    <div class="row"><button class="cbtn adj" data-adj="${i.id}:${field}:${down}" aria-label="${label} down">−</button>
    <button class="cbtn adj" data-adj="${i.id}:${field}:${up}" aria-label="${label} up">+</button></div></div>`;
      }

      /* ================= Sheets ================= */
      function openSheet(fn) {
        ui.sheet = fn;
        fn();
      }
      function closeSheet() {
        ui.sheet = null;
        document.getElementById('modal').innerHTML = '';
      }
      /* Mid-flow dialogs (`locked`) have no X: they end with their own button. */
      function sheet(html, opts = {}) {
        const m = document.getElementById('modal');
        m.innerHTML = `<div class="scrim" data-scrim="${opts.locked ? 'locked' : 'close'}"><div class="sheet" role="dialog" aria-modal="true">
    ${opts.locked ? '' : `<button class="x" data-close aria-label="Close">${ICON.x}</button>`}${html}</div></div>`;
        hydrateImages(m);
      }

      let flipState = {};
      function zoomCard(code, opts = {}) {
        const c = C[code];
        const key = opts.key || code;
        const back = flipState[key] ?? !!opts.back;
        const shape = LANDSCAPE.has(c.type) ? 'landscape' : 'portrait';
        return `<div class="bigcard ${shape}">${face(code, back, { text: true })}${c.back || c.type === 'location' ? `<button class="btn flipbtn" data-flip="${key}" data-default="${opts.back ? 1 : 0}">Flip</button>` : ''}</div>`;
      }

      function showAgenda() {
        openSheet(() => {
          const ag = C[S.agenda.code];
          sheet(`<span class="kicker">Agenda ${ag.stage} · ${S.agenda.doom} of ${ag.doom} doom</span><h2>${esc(ag.name)}</h2>
      ${zoomCard(S.agenda.code, { key: 'agenda' })}
      ${ui.edit ? `<div class="stepper"><span>Doom on the agenda</span><button class="cbtn" data-act="doom-">−</button><span class="v">${S.agenda.doom}</span><button class="cbtn" data-act="doom+">+</button></div>` : ''}
      <p class="note">Doom in play counts toward the threshold too (doom on locations: ${totalDoom() - S.agenda.doom}). At ${ag.doom}, the agenda advances in the Mythos phase.</p>
      ${ui.edit ? '' : '<div class="row"><button class="btn" data-act="advance-agenda">Advance agenda now</button></div>'}`);
        });
      }
      function showAct() {
        openSheet(() => {
          const ac = C[S.act.code],
            need = actNeed();
          sheet(`<span class="kicker">Act ${ac.stage}${need == null ? '' : ` · ${S.act.clues} of ${need} clues`}</span><h2>${esc(ac.name)}</h2>
      ${zoomCard(S.act.code, { key: 'act' })}
      ${
        need == null
          ? '<p class="note">Objective: defeat the Ghoul Priest, then this act advances and the scenario resolves.</p>'
          : `
      ${
        ui.edit
          ? `<div class="stepper"><span>Clues on the act</span><button class="cbtn" data-act="actclue-">−</button><span class="v">${S.act.clues}</span><button class="cbtn" data-act="actclue+">+</button></div>`
          : `
      <p>Move clues from investigators onto the act. Advancing spends the clues on the act.</p>

      function showScenario() {

      ${

      <div class="row"><button class="btn" data-defeat="${id}">Defeated</button></div>`

      ${can ? `<div class="row"><button class="btn" data-fight="${id}">Fight</button>${e.engaged === ti.id ? `<button class="btn" data-evade="${id}">Evade</button>` : `<button class="btn" data-engage="${id}">Engage</button>`}</div>` : ''}`);

      function showInvestigator(id) {

      function showCard(code) {

    }</div>

      function showMenu() {
        openSheet(() =>
          sheet(`<span class="kicker">Round ${S.round}</span><h2>Menu</h2>
    <h3>Look</h3>
    <div class="seg" role="radiogroup" aria-label="Card look">
