<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96">
<!-- The frame of a panel or dialog (base.css `border-image`, sliced 24 units in from each side), drawn for this app in the playmat's line style: a brass rule along the edge with a finer one inside it, and in each corner a quarter of the playmat's zodiac ring, its ticks and a star. Its colour is the dark theme's accent of tokens.css; an image cannot read the tokens, so the light theme has panel_frame_light.svg. -->
<defs>
<g id="corner" fill="none" stroke="#c9a45c">
<path stroke-width="1.5" d="M16.5 1.5H48M1.5 16.5V48"/>
<path stroke-width="0.75" stroke-opacity="0.6" d="M21.5 5.5H48M5.5 21.5V48"/>
<path stroke-width="1.2" d="M16.5 1.5A15 15 0 0 1 1.5 16.5"/>
<path stroke-width="0.75" d="M12.5 1.5A11 11 0 0 1 1.5 12.5"/>
<path stroke-width="0.75" d="M12.3 3.6L16.2 4.4M13.0 6.3L15.4 7.2M10.6 7.6L14.0 9.8M10.3 10.3L12.1 12.1M7.6 10.6L9.8 14.0M6.3 13.0L7.2 15.4M3.6 12.3L4.4 16.2"/>
<path fill="#c9a45c" stroke="none" d="M5 1.5L5.9 4.1L8.5 5L5.9 5.9L5 8.5L4.1 5.9L1.5 5L4.1 4.1Z"/>
</g>
</defs>
<use href="#corner"/>
<use href="#corner" transform="rotate(90 48 48)"/>
<use href="#corner" transform="rotate(180 48 48)"/>
<use href="#corner" transform="rotate(270 48 48)"/>
</svg>
